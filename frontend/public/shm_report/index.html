    <script>
        const ADMIN_PASSWORD = "1152";
        document.addEventListener('DOMContentLoaded', () => {
            const hasAuth = sessionStorage.getItem("isAdminAuthenticated") === "true";
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            const pwdInput = document.getElementById('admin-password-input');
            if (hasAuth) {
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (mainContent) mainContent.style.filter = 'blur(5px)';
                if (modal) modal.style.display = 'flex';
                if (pwdInput) {
                    pwdInput.focus();
                    pwdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitAdminPassword(); });
                }
            }
        });
        function submitAdminPassword() {
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('password-error');
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            if (input.value === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuthenticated", "true");
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (error) error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbVG3iL3FBJe6alPLZnhFW_QAGpzeqFoY",
            authDomain: "namhwa-safety-dashboard.firebaseapp.com",
            projectId: "namhwa-safety-dashboard",
            storageBucket: "namhwa-safety-dashboard.firebasestorage.app",
            messagingSenderId: "152864778612",
            appId: "1:152864778612:web:ecc482adce93a1534a2421"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CATEGORY_NAMES = [
            "1. 안전보건경영 방침 및 목표관리 절차",
            "2. 안전보건관리책임자 등 업무수행 평가 절차",
            "3. 종사자 의견 청취 절차",
            "4. 비상사태 대비·대응 절차",
            "5. 협력사 수준관리 절차",
            "6. 안전보건관계 법령 등 이행관리 절차",
            "7. 시스템 평가 및 개선 절차"
        ];

        function getPhaseWeights(progress) {
            if (progress >= 100) return { maxSystemScore: 100, maxFieldScore: 0 };
            if (progress < 30) return { maxSystemScore: 70, maxFieldScore: 30 };
            if (progress < 80) return { maxSystemScore: 50, maxFieldScore: 50 };
            return { maxSystemScore: 60, maxFieldScore: 40 };
        }

        function toTimeMs(d) { return d.createdAt && d.createdAt.seconds ? d.createdAt.seconds : 0; }

        // 해당 분기(연도 일치)의 시스템점검 중 현장별 최신 문서만 남긴다.
        async function fetchLatestSystemChecksByQuarter(year, quarter) {
            const snap = await getDocs(query(collection(db, "shm_checks"), where("headerInfo.quarter", "==", quarter)));
            const bySite = {};
            snap.forEach(d => {
                const data = d.data();
                data._docId = d.id;
                const docYear = (data.headerInfo?.checkDate || '').slice(0, 4);
                if (docYear !== year) return;
                const name = data.headerInfo?.siteName;
                if (!name) return;
                if (!bySite[name] || toTimeMs(data) > toTimeMs(bySite[name])) bySite[name] = data;
            });
            return bySite; // { siteName: doc }
        }

        async function fetchLatestFieldChecksByQuarter(year, quarter) {
            const snap = await getDocs(query(collection(db, "field_checks"), where("headerInfo.quarter", "==", quarter)));
            const bySite = {};
            snap.forEach(d => {
                const data = d.data();
                const docYear = data.headerInfo?.year || '';
                if (docYear !== year) return;
                const name = data.headerInfo?.siteName;
                if (!name) return;
                if (!bySite[name] || toTimeMs(data) > toTimeMs(bySite[name])) bySite[name] = data;
            });
            return bySite;
        }

        // 현장별 결과 배열 생성: 구버전(통합 저장) / 신버전(시스템+현장 분리) 모두 처리
        async function computeSiteResults(year, quarter) {
            const [sysBySite, fieldBySite] = await Promise.all([
                fetchLatestSystemChecksByQuarter(year, quarter),
                fetchLatestFieldChecksByQuarter(year, quarter)
            ]);

            const results = [];
            for (const [siteName, sysDoc] of Object.entries(sysBySite)) {
                const isOld = !!(sysDoc.finalScores && sysDoc.finalScores.totalScore !== undefined);
                const majorAccident = parseInt(sysDoc.deductions?.majorAccident || '0', 10) || 0;
                const workAccident = parseInt(sysDoc.deductions?.workAccident || '0', 10) || 0;

                if (isOld) {
                    results.push({
                        siteName,
                        score: parseFloat(sysDoc.finalScores.totalScore) || 0,
                        grade: (sysDoc.finalScores.finalGrade || '-').replace('우수', '양호'),
                        majorAccident, workAccident,
                        schema: 'old',
                        fieldRaw: parseFloat(sysDoc.deductions?.fieldScore) || null,
                        fieldItems: null,
                        sectionBreakdown: null
                    });
                    continue;
                }

                const progress = parseFloat(sysDoc.headerInfo?.progress) || 0;
                const weights = getPhaseWeights(progress);
                const systemRaw = Math.max(0, parseFloat(sysDoc.finalScores?.systemConverted) || 0);
                const systemConverted = (systemRaw / 100) * weights.maxSystemScore;

                const fieldDoc = fieldBySite[siteName];
                let fieldConverted = 0;
                let hasField = false;
                let fieldRawScore = null;
                if (fieldDoc) {
                    hasField = true;
                    fieldRawScore = Math.min(100, Math.max(0, parseFloat(fieldDoc.result?.totalScore) || 0));
                    fieldConverted = (fieldRawScore / 100) * weights.maxFieldScore;
                }

                const finalTotal = Math.max(0, systemConverted + fieldConverted);
                let grade = '미흡';
                if (finalTotal >= 90) grade = '양호';
                else if (finalTotal >= 60) grade = '보통';

                results.push({
                    siteName,
                    score: finalTotal,
                    grade,
                    majorAccident, workAccident,
                    schema: 'new',
                    hasField,
                    fieldRaw: fieldRawScore,
                    fieldItems: fieldDoc ? (fieldDoc.items || null) : null,
                    sectionBreakdown: sysDoc.sectionBreakdown || null
                });
            }
            return results;
        }

        function computeCompanyStats(results) {
            if (results.length === 0) return null;
            const avgScore = results.reduce((s, r) => s + r.score, 0) / results.length;
            const gradeCounts = { 양호: 0, 보통: 0, 미흡: 0 };
            results.forEach(r => { if (gradeCounts[r.grade] !== undefined) gradeCounts[r.grade]++; });
            const totalMajor = results.reduce((s, r) => s + r.majorAccident, 0);
            const totalWork = results.reduce((s, r) => s + r.workAccident, 0);
            return { avgScore, gradeCounts, totalMajor, totalWork, siteCount: results.length };
        }

        // 카테고리별 전사 평균 달성률(%) — 항목별 획득/배점(categoryScores)이 있는 현장은 정확한 평균 %,
        // 없는(과거) 현장은 강점/약점 이진 분류를 대략적인 %로 환산(강점=100, 약점=50)해 참고치로 사용.
        function computeCategoryAchievement(results) {
            const withBreakdown = results.filter(r => r.sectionBreakdown);
            const rows = CATEGORY_NAMES.map(name => {
                let sum = 0, n = 0, approx = false;
                withBreakdown.forEach(r => {
                    const cs = (r.sectionBreakdown.categoryScores || []).find(c => c.category === name);
                    if (cs && cs.possible > 0) {
                        sum += (cs.obtained / cs.possible) * 100;
                        n++;
                        return;
                    }
                    const isWeak = (r.sectionBreakdown.weaknesses || []).some(w => w.category === name);
                    const isStrong = (r.sectionBreakdown.strengths || []).some(s => s === name);
                    if (isWeak) { sum += 50; n++; approx = true; }
                    else if (isStrong) { sum += 100; n++; approx = true; }
                });
                return { name, pct: n > 0 ? sum / n : null, sampleSize: n, approx };
            });
            return { rows, sampleSize: withBreakdown.length };
        }

        function achievementFor(categoryAchievement, name) {
            const row = categoryAchievement.rows.find(r => r.name === name);
            return row && row.pct !== null ? row.pct : null;
        }

        // Plan=계획수립(3,4,5) / Do=법령이행·책임자업무(2,6) / Check=현장확인점검(현장점검표 점수) / Action=환류활동(7)
        // 방침목표 축은 카테고리1 고유 값이 아니라, 위 4개 축(Plan/Do/Check/Action)의 종합(평균) 점수를 표시한다.
        function computePDCA(categoryAchievement, results) {
            const avgOf = names => {
                const vals = names.map(n => achievementFor(categoryAchievement, n)).filter(v => v !== null);
                return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
            };

            const plan = avgOf([CATEGORY_NAMES[2], CATEGORY_NAMES[3], CATEGORY_NAMES[4]]);
            const doVal = avgOf([CATEGORY_NAMES[1], CATEGORY_NAMES[5]]);

            const fieldScores = results.map(r => r.fieldRaw).filter(v => v !== null && v !== undefined);
            const check = fieldScores.length ? fieldScores.reduce((a, b) => a + b, 0) / fieldScores.length : null;

            const action = achievementFor(categoryAchievement, CATEGORY_NAMES[6]);

            const pdcaVals = [plan, doVal, check, action].filter(v => v !== null);
            const policy = pdcaVals.length ? pdcaVals.reduce((a, b) => a + b, 0) / pdcaVals.length : null;

            const to10 = v => v === null ? null : Math.round((v / 10) * 10) / 10;
            return {
                policy: to10(policy), plan: to10(plan), do: to10(doVal), check: to10(check), action: to10(action)
            };
        }

        // sh_check(현장점검표) 101개 항목의 사고유형(대분류) 매핑 — sh_check의 checklistData와 동일한 순서/개수로
        // index(0~100)를 사고유형에 대응시킨다.
        const HAZARD_GROUPS = [
            ['추락', 27], ['충돌 및 협착', 9], ['붕괴 및 도괴', 17],
            ['감전', 19], ['낙하 및 전도', 13], ['기타', 16]
        ];
        function buildHazardIndexMap() {
            const map = [];
            HAZARD_GROUPS.forEach(([name, count]) => { for (let i = 0; i < count; i++) map.push(name); });
            return map;
        }
        const HAZARD_INDEX_MAP = buildHazardIndexMap();

        function computeHazardBreakdown(results) {
            const totals = {};
            HAZARD_GROUPS.forEach(([name]) => { totals[name] = 0; });
            let sampleSize = 0;
            results.forEach(r => {
                if (!r.fieldItems) return;
                sampleSize++;
                r.fieldItems.forEach(item => {
                    const category = HAZARD_INDEX_MAP[item.index];
                    if (!category) return;
                    const count = parseInt(item.issueCount, 10) || 0;
                    totals[category] += count;
                });
            });
            const rows = HAZARD_GROUPS.map(([name]) => ({ name, count: totals[name] }))
                .sort((a, b) => b.count - a.count);
            return { rows, sampleSize };
        }

        window.__reportState = {};
        window.charts = {};

        function destroyChart(key) {
            if (window.charts[key]) { window.charts[key].destroy(); window.charts[key] = null; }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        async function runSearch() {
            const year = document.getElementById('year-search').value;
            const quarter = document.getElementById('quarter-search').value;
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            document.getElementById('print-btn').style.display = 'none';

            try {
                const results = await computeSiteResults(year, quarter);
                if (results.length === 0) {
                    document.getElementById('result-area').innerHTML =
                        `<div class="status-message">${escapeHtml(year)}년 ${escapeHtml(quarter)}에 저장된 시스템점검 데이터가 없습니다.</div>`;
                    return;
                }
                window.__reportState = { year, quarter, results };
                await renderReport(year, quarter, results);
                document.getElementById('print-btn').style.display = 'inline-block';
            } catch (error) {
                console.error('보고서 집계 실패:', error);
                document.getElementById('result-area').innerHTML =
                    `<div class="status-message">집계 중 오류가 발생했습니다: ${escapeHtml(error.message)}</div>`;
            } finally {
                overlay.style.display = 'none';
            }
        }

        window.runSearch = runSearch;

        async function fetchTrend(year) {
            const quarters = ['1분기', '2분기', '3분기', '4분기'];
            const trend = [];
            for (const q of quarters) {
                const results = await computeSiteResults(year, q);
                if (results.length === 0) continue;
                const stats = computeCompanyStats(results);
                trend.push({ label: `${year} ${q}`, avgScore: stats.avgScore });
            }
            return trend;
        }

        async function renderReport(year, quarter, results) {
            const stats = computeCompanyStats(results);
            const categoryAchievement = computeCategoryAchievement(results);
            const pdca = computePDCA(categoryAchievement, results);
            const hazard = computeHazardBreakdown(results);
            const trend = await fetchTrend(year);

            const sorted = results.slice().sort((a, b) => a.score - b.score);
            const siteList = sorted.slice().reverse().map(r => `${r.siteName}(${escapeHtml(r.grade)})`).join(', ');

            const area = document.getElementById('result-area');
            area.innerHTML = `
                <div class="section-title">핵심 지표 (${escapeHtml(year)}년 ${escapeHtml(quarter)})</div>
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="value">${stats.avgScore.toFixed(1)}</div><div class="label">전사 평균점수</div></div>
                    <div class="kpi-card grade-good"><div class="value">${stats.gradeCounts.양호}</div><div class="label">양호 현장</div></div>
                    <div class="kpi-card grade-mid"><div class="value">${stats.gradeCounts.보통}</div><div class="label">보통 현장</div></div>
                    <div class="kpi-card grade-poor"><div class="value">${stats.gradeCounts.미흡}</div><div class="label">미흡 현장</div></div>
                    <div class="kpi-card grade-poor"><div class="value">${stats.totalMajor}</div><div class="label">중대재해(건)</div></div>
                    <div class="kpi-card grade-mid"><div class="value">${stats.totalWork}</div><div class="label">산재(건)</div></div>
                </div>

                <div class="section-title">현장별 종합점수</div>
                <div class="chart-box tall"><canvas id="site-chart"></canvas></div>
                <p class="note">${escapeHtml(siteList)}</p>

                <div class="section-title">PDCA 관리사이클 이행 수준 (10점 만점)</div>
                <div class="chart-box"><canvas id="pdca-chart"></canvas></div>
                <p class="note">※ 방침목표(종합)=Plan/Do/Check/Action 4개 축의 평균 / Plan(계획수립)=의견청취·비상대응·협력사관리 / Do(법령이행·책임자업무)=관리책임자 업무수행+법령이행 / Check(현장확인점검)=현장점검표 / Action(환류활동)=시스템 평가 및 개선</p>

                <div class="section-title">전사 카테고리별 달성률 (시스템점검 기준)</div>
                <div class="chart-box"><canvas id="category-chart"></canvas></div>
                <p class="note">※ 세부 항목 데이터가 있는 현장(${categoryAchievement.sampleSize}개) 기준입니다. 구버전(총점만 있는) 데이터는 강점/약점 이진 분류를 참고치로 환산해 포함했습니다.</p>

                <div class="section-title">사고유형별 지적건수 (현장점검 기준)</div>
                <div class="chart-box"><canvas id="hazard-chart"></canvas></div>
                <p class="note">※ 현장점검표 데이터가 있는 현장(${hazard.sampleSize}개) 기준입니다.</p>

                <div class="section-title">분기별 전사 평균점수 추이 (${escapeHtml(year)}년)</div>
                <div class="chart-box"><canvas id="trend-chart"></canvas></div>

                <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>경영진 보고용 총평</span>
                    <div class="no-print" style="display:flex; gap:8px;">
                        <button id="ai-exec-btn" class="btn btn-ai" style="padding:4px 10px; font-size:0.8em;">&#9881; AI 총평 생성</button>
                    </div>
                </div>
                <div id="exec-summary-display" contenteditable="true" data-placeholder="[AI 총평 생성] 버튼을 누르거나 이 영역을 직접 클릭해 입력하세요."></div>

                <div class="section-title">현장별 상세</div>
                <table class="site-table">
                    <thead><tr><th class="text-left">현장명</th><th>종합점수</th><th>등급</th><th>중대재해</th><th>산재</th><th>비고</th></tr></thead>
                    <tbody>
                        ${sorted.map(r => `
                            <tr>
                                <td class="text-left">${escapeHtml(r.siteName)}</td>
                                <td>${r.score.toFixed(1)}</td>
                                <td><span class="grade-badge ${r.grade}">${escapeHtml(r.grade)}</span></td>
                                <td>${r.majorAccident}</td>
                                <td>${r.workAccident}</td>
                                <td style="font-size:0.8em; color:#888;">${r.schema === 'old' ? '구버전(통합)' : (r.hasField ? '' : '현장점검 없음(시스템만)')}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            destroyChart('site');
            destroyChart('pdca');
            destroyChart('category');
            destroyChart('hazard');
            destroyChart('trend');

            window.charts.site = new Chart(document.getElementById('site-chart'), {
                type: 'bar',
                data: {
                    labels: sorted.map(r => r.siteName),
                    datasets: [{
                        label: '종합점수',
                        data: sorted.map(r => r.score),
                        backgroundColor: sorted.map(r => r.grade === '양호' ? '#2e7d32' : r.grade === '보통' ? '#f57f17' : '#c62828')
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });

            window.charts.pdca = new Chart(document.getElementById('pdca-chart'), {
                type: 'radar',
                data: {
                    labels: ['방침목표(종합)', 'Plan(계획수립)', 'Do(법령이행·책임자업무)', 'Check(현장확인점검)', 'Action(환류활동)'],
                    datasets: [{
                        label: '이행수준',
                        data: [pdca.policy, pdca.plan, pdca.do, pdca.check, pdca.action].map(v => v === null ? 0 : v),
                        borderColor: '#1a237e',
                        backgroundColor: 'rgba(26,35,126,0.2)',
                        pointBackgroundColor: '#1a237e'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { r: { min: 0, max: 10, ticks: { stepSize: 2 } } },
                    plugins: { legend: { display: false } }
                }
            });

            window.charts.category = new Chart(document.getElementById('category-chart'), {
                type: 'bar',
                data: {
                    labels: categoryAchievement.rows.map(c => c.name.replace(/^\d+\.\s*/, '')),
                    datasets: [{
                        label: '평균 달성률(%)',
                        data: categoryAchievement.rows.map(c => c.pct !== null ? Math.round(c.pct) : 0),
                        backgroundColor: '#3949ab'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });

            window.charts.hazard = new Chart(document.getElementById('hazard-chart'), {
                type: 'bar',
                data: {
                    labels: hazard.rows.map(h => h.name),
                    datasets: [{
                        label: '지적건수',
                        data: hazard.rows.map(h => h.count),
                        backgroundColor: '#c62828'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { min: 0 } },
                    plugins: { legend: { display: false } }
                }
            });

            window.charts.trend = new Chart(document.getElementById('trend-chart'), {
                type: 'line',
                data: {
                    labels: trend.map(t => t.label),
                    datasets: [{
                        label: '전사 평균점수',
                        data: trend.map(t => t.avgScore),
                        borderColor: '#1a237e',
                        backgroundColor: 'rgba(26,35,126,0.15)',
                        fill: true, tension: 0.3
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });

            document.getElementById('ai-exec-btn').addEventListener('click', () => generateExecSummary(year, quarter, stats, categoryAchievement, pdca, hazard, results));
            document.getElementById('exec-summary-display').addEventListener('input', function () {
                if (this.textContent.trim() === '') this.innerHTML = '';
            });
        }

        async function generateExecSummary(year, quarter, stats, categoryAchievement, pdca, hazard, results) {
            const btn = document.getElementById('ai-exec-btn');
            const display = document.getElementById('exec-summary-display');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = '생성 중...';
            try {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const baseUrl = isLocal
                    ? 'http://127.0.0.1:5001/namhwa-safety-dashboard/us-central1'
                    : 'https://us-central1-namhwa-safety-dashboard.cloudfunctions.net';
                const apiUrl = `${baseUrl}/generate_shm_summary`;

                const weakCategories = categoryAchievement.rows.filter(c => c.pct !== null && c.pct < 70).map(c => c.name);
                const sorted = results.slice().sort((a, b) => a.score - b.score);

                const payload = {
                    executive: true,
                    period: `${year}년 ${quarter}`,
                    siteCount: stats.siteCount,
                    avgScore: Math.round(stats.avgScore * 10) / 10,
                    gradeCounts: stats.gradeCounts,
                    majorAccidentTotal: stats.totalMajor,
                    workAccidentTotal: stats.totalWork,
                    weakCategories,
                    worstSites: sorted.slice(0, 3).map(r => ({ name: r.siteName, score: Math.round(r.score * 10) / 10, grade: r.grade })),
                    bestSites: sorted.slice(-3).reverse().map(r => ({ name: r.siteName, score: Math.round(r.score * 10) / 10, grade: r.grade })),
                    pdca: {
                        policy: pdca.policy, plan: pdca.plan, do: pdca.do, check: pdca.check, action: pdca.action
                    },
                    topHazards: hazard.rows.slice(0, 3).map(h => ({ name: h.name, count: h.count }))
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let detail = '';
                    try { detail = (await response.json()).detail || ''; } catch (e) { }
                    throw new Error(`서버 응답 오류 (${response.status}) ${detail}`);
                }

                const result = await response.json();
                if (!result.success || !result.summary) throw new Error(result.detail || '결과 값이 없습니다.');

                display.innerHTML = result.summary;
                btn.style.backgroundColor = '#2e7d32';
                btn.textContent = '✓ 생성 완료';
            } catch (error) {
                console.error('경영진 총평 생성 실패:', error);
                alert('AI 총평 생성 중 오류가 발생했습니다: ' + error.message);
                btn.textContent = '✗ 실패';
            } finally {
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.disabled = false;
                    btn.style.backgroundColor = '';
                }, 2500);
            }
        }

        document.getElementById('search-btn').addEventListener('click', runSearch);
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        // 년도 옵션(올해 기준 -1 ~ +1) + 오늘 기준 분기 자동 선택
        const yearSel = document.getElementById('year-search');
        const curYear = new Date().getFullYear();
        for (let y = curYear - 1; y <= curYear + 1; y++) {
            const opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = y + '년';
            if (y === curYear) opt.selected = true;
            yearSel.appendChild(opt);
        }
        document.getElementById('quarter-search').value = `${Math.ceil((new Date().getMonth() + 1) / 3)}분기`;

        // 노션 등 외부 붙여넣기 서식 방지
        document.addEventListener('paste', function (e) {
            if (!e.target.isContentEditable) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        });
    </script>
</body>
</html>
