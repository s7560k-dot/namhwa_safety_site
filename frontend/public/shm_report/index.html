<!DOCTYPE html>
<html lang="ko">

<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>전사 안전보건 분기 보고서</title>
    <script>
        const ADMIN_PASSWORD = "1152";
        document.addEventListener('DOMContentLoaded', () => {
            const hasAuth = sessionStorage.getItem("isAdminAuthenticated") === "true";
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            const pwdInput = document.getElementById('admin-password-input');
            if (hasAuth) {
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (mainContent) mainContent.style.filter = 'blur(5px)';
                if (modal) modal.style.display = 'flex';
                if (pwdInput) {
                    pwdInput.focus();
                    pwdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitAdminPassword(); });
                }
            }
        });
        function submitAdminPassword() {
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('password-error');
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            if (input.value === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuthenticated", "true");
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (error) error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px;
            background-color: #f7f7f7;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #eef1fb;
            border-radius: 8px;
        }

        .search-bar label { font-weight: bold; color: #1a237e; margin-right: 4px; }
        .search-bar select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }

        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: #fff;
        }
        .btn-search { background-color: #1a237e; }
        .btn-print { background-color: #3949ab; }
        .btn-ai { background-color: #2e7d32; }

        .status-message {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffe08a;
        }

        .section-title {
            font-size: 1.25em;
            font-weight: bold;
            margin-top: 34px;
            margin-bottom: 14px;
            border-bottom: 3px solid #3949ab;
            padding-bottom: 8px;
            color: #1a237e;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        .kpi-card {
            background-color: #eef1fb;
            border-radius: 10px;
            padding: 16px 10px;
            text-align: center;
        }
        .kpi-card .value { font-size: 1.7em; font-weight: bold; color: #1a237e; }
        .kpi-card.grade-good .value { color: #2e7d32; }
        .kpi-card.grade-mid .value { color: #f57f17; }
        .kpi-card.grade-poor .value { color: #c62828; }
        .kpi-card .label { font-size: 0.8em; color: #666; margin-top: 4px; }

        .chart-box {
            position: relative;
            height: 340px;
            margin-bottom: 10px;
            overflow: hidden; /* 캔버스가 어떤 이유로든 박스보다 커지더라도 아래 내용과 겹치지 않도록 방지 */
        }
        .chart-box.tall { height: 420px; }
        .chart-box img.print-chart-img { display: none; }

        .note {
            font-size: 0.82em;
            color: #888;
            margin-top: 4px;
        }

        .site-list-note {
            list-style: none;
            margin: 6px 0 0;
            padding: 0;
            font-size: 0.82em;
            color: #888;
        }
        .site-list-note li {
            padding: 2px 0;
            border-bottom: 1px dotted #eee;
        }

        .detail-list {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }
        .detail-group {
            font-size: 0.85em;
            border-left: 3px solid #c62828;
            padding-left: 10px;
        }
        .detail-group.accent-indigo { border-left-color: #3949ab; }
        .detail-group strong { color: #333; }
        .detail-group ul { margin: 4px 0 0; padding-left: 18px; color: #555; }
        .detail-group li { margin-bottom: 2px; }
        .detail-more { color: #999; font-style: italic; }

        /* 지적사항 사진대지: 텍스트 목록과는 별도 섹션으로, 사진이 첨부된 지적사항만
           카드 형태(사진 + 캡션)로 모아 보여준다. 건설현장 보고서에서 흔히 쓰는
           "사진대지" 양식과 동일하게 사진을 크게, 캡션을 사진 아래에 배치한다. */
        .photo-log-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .photo-log-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background-color: #fafafa;
        }
        .photo-log-img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background-color: #eee;
        }
        .photo-log-caption {
            padding: 8px 10px;
            font-size: 0.82em;
            line-height: 1.5;
        }
        .photo-log-no { font-weight: bold; color: #3949ab; }
        .photo-log-site { font-weight: bold; color: #333; }
        .photo-log-cat { color: #555; }
        .photo-log-comment { color: #777; margin-top: 2px; }

        /* 토목·건축공사 현황 지도: 좌측에 간략화된 대한민국 지도(정밀 행정경계 아님, 참고용
           위치), 우측에 공종별 범례와 지역별 실제 현장명 목록을 배치한다. */
        .site-map-wrap {
            margin-top: 10px;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .site-map-svg {
            width: 220px;
            flex-shrink: 0;
        }
        .site-map-side { flex: 1; min-width: 0; }
        .site-map-legend {
            display: flex;
            gap: 18px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 0.95em;
        }
        .site-map-legend-item { display: flex; align-items: center; gap: 6px; }
        .site-map-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .site-map-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 16px;
        }
        .site-map-region-group { font-size: 0.85em; }
        .site-map-region-group strong { color: #333; }
        .site-map-region-group ul { list-style: none; margin: 4px 0 0; padding: 0; color: #555; }
        .site-map-region-group li { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }

        #exec-summary-display {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            min-height: 40px;
            white-space: pre-wrap;
            line-height: 1.7;
            cursor: text;
        }
        #exec-summary-display:empty:before {
            content: attr(data-placeholder);
            color: #999;
        }
        #exec-summary-display:focus { outline: 2px solid #3949ab; outline-offset: -1px; }

        table.site-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table.site-table th, table.site-table td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: center;
        }
        table.site-table th { background-color: #e8eaf6; }
        table.site-table td.text-left { text-align: left; }
        .grade-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 0.85em;
        }
        .grade-badge.양호 { background-color: #2e7d32; }
        .grade-badge.보통 { background-color: #f57f17; }
        .grade-badge.미흡 { background-color: #c62828; }

        .no-print { }

        @media print {
            /* 세로(A4 Portrait) 레이아웃, 상단 25mm / 좌우 10mm / 하단 10mm 여백 (shm_result 등 다른 보고서 페이지와 동일한 규격) */
            @page { size: A4 portrait; margin: 25mm 10mm 10mm 10mm !important; }
            body, html {
                margin: 0 !important; padding: 0 !important; background-color: #fff !important;
                -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
                font-size: 11pt !important; line-height: 1.5 !important;
            }
            .container { box-shadow: none !important; border-radius: 0 !important; padding: 0 !important; margin: 0 auto !important; width: 100% !important; max-width: 100% !important; }
            .no-print { display: none !important; }

            /* 가독성을 위한 인쇄 전용 크기 재조정: 세로 레이아웃은 landscape보다 폭이 좁아지므로
               KPI 카드는 6열→3열(2행)로, 차트는 폭 대비 과도하게 눌리지 않도록 높이를 낮춘다. */
            h1 { font-size: 20pt !important; margin-bottom: 6px !important; }
            .subtitle { font-size: 10pt !important; }
            .section-title { font-size: 13.5pt !important; margin-top: 22px !important; margin-bottom: 10px !important; page-break-after: avoid; }

            .kpi-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
            .kpi-card { padding: 10px 6px !important; page-break-inside: avoid; }
            .kpi-card .value { font-size: 16pt !important; }
            .kpi-card .label { font-size: 9pt !important; }

            /* .chart-box.tall(현장별 종합점수)은 현장 수에 따라 렌더링 시 인라인 height가 계산되므로
               여기서 고정값으로 덮어쓰지 않는다 — 인쇄는 그 시점에 캡처해 둔 정적 이미지를 그대로
               보여주는 방식이라(realtime redraw 아님), 여기서 박스 높이만 늘려봐야 막대 간격이
               넓어지지 않고 이미지 상하에 여백만 생긴다. 막대 간격 자체는 캡처 전 높이(화면용
               인라인 height) 계산식에서 늘려야 하므로 그쪽에서 처리한다. */
            .chart-box:not(.tall) { height: 230px !important; page-break-inside: avoid; }
            .chart-box.tall { page-break-inside: avoid; }
            .note { font-size: 9pt !important; }
            .site-list-note { font-size: 10pt !important; }
            .site-list-note li { padding: 4px 0 !important; }
            /* page-break-inside: avoid를 목록 전체(.detail-list)가 아니라 카테고리별 그룹
               (.detail-group) 단위로 걸어둔다. 전체 목록에 걸어두면 페이지에 절반만 들어가도
               목록 전체가 통째로 다음 페이지로 밀려나면서 현재 페이지 하단에 큰 여백이 남고
               다음 페이지도 그만큼 내용이 밀리는 문제가 있었다. 그룹 단위로 좁히면 들어갈
               수 있는 그룹까지는 현재 페이지를 채우고, 넘치는 그룹만 다음 페이지로 넘어간다. */
            .detail-list { grid-template-columns: 1fr !important; gap: 6px !important; }
            .detail-group { font-size: 9pt !important; page-break-inside: avoid; }

            /* 사진대지 카드도 그룹과 동일하게 카드 단위로 페이지가 넘어가도록 한다. */
            .photo-log-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
            .photo-log-card { page-break-inside: avoid; }
            .photo-log-caption { font-size: 8.5pt !important; padding: 6px 8px !important; }

            .site-map-wrap { page-break-inside: avoid; gap: 14px !important; }
            .site-map-svg { width: 170px !important; }
            .site-map-legend { font-size: 9.5pt !important; margin-bottom: 8px !important; }
            .site-map-list { font-size: 9pt !important; grid-template-columns: repeat(2, 1fr) !important; }

            /* 인쇄용 이미지(<img class="print-chart-img">)는 차트가 만들어질 때 이미 DOM에
               들어가 있다(refreshPrintImage). 화면↔인쇄 전환은 여기 CSS만으로 처리 — JS가
               인쇄 시점에 개입하지 않으므로 beforeprint/afterprint 타이밍 문제가 생기지 않는다. */
            .chart-box canvas { display: none !important; }
            .chart-box img.print-chart-img {
                display: block !important;
                width: 100% !important; height: 100% !important;
                object-fit: contain !important;
            }

            table.site-table { font-size: 10pt !important; }
            table.site-table th, table.site-table td { padding: 6px 8px !important; }
            .grade-badge { font-size: 9.5pt !important; }

            #exec-summary-display { font-size: 11pt !important; line-height: 1.6 !important; }
        }
    </style>
</head>

<body>

    <div class="container" id="main-content">
        <h1>전사 안전보건 분기 보고서</h1>

        <div class="search-bar no-print">
            <label for="year-search">년도</label>
            <select id="year-search"></select>
            <label for="quarter-search">분기</label>
            <select id="quarter-search">
                <option value="1분기">1분기</option>
                <option value="2분기">2분기</option>
                <option value="3분기">3분기</option>
                <option value="4분기">4분기</option>
            </select>
            <button id="search-btn" class="btn btn-search">조회</button>
            <button id="print-btn" class="btn btn-print" style="display:none;">&#128424; 인쇄하기</button>
        </div>

        <div id="result-area">
            <p style="text-align:center; color:#888; padding: 40px 0;">년도와 분기를 선택한 뒤 [조회]를 눌러주세요.</p>
        </div>
    </div>

    <div id="loading-overlay"
        style="display: none; position: fixed; inset: 0; background-color: rgba(255,255,255,0.8); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
        <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px; font-weight: bold; color: #333;">집계 중...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <!-- 관리자 비밀번호 입력 모달 -->
    <div id="password-modal" style="position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.75); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;">
        <div style="background-color: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; border: 1px solid #f1f5f9; box-sizing: border-box; font-family: sans-serif;">
            <div style="width: 64px; height: 64px; background-color: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #2563eb;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 32px; height: 32px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <h2 style="font-size: 24px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">관리자 인증</h2>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 24px 0;">페이지에 접근하려면 관리자 비밀번호를 입력해 주세요.</p>
            <div style="margin-bottom: 24px;">
                <input type="password" id="admin-password-input"
                    style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; text-align: center; font-family: monospace; font-size: 24px; letter-spacing: 0.25em; box-sizing: border-box;"
                    placeholder="••••" autofocus autocomplete="new-password">
                <p id="password-error" style="color: #ef4444; font-size: 12px; margin-top: 8px; display: none; font-weight: 600;">비밀번호가 일치하지 않습니다.</p>
            </div>
            <button onclick="submitAdminPassword()"
                style="width: 100%; background-color: #2563eb; color: #ffffff; font-weight: 700; padding: 14px 24px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px;">
                인증하기
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbVG3iL3FBJe6alPLZnhFW_QAGpzeqFoY",
            authDomain: "namhwa-safety-dashboard.firebaseapp.com",
            projectId: "namhwa-safety-dashboard",
            storageBucket: "namhwa-safety-dashboard.firebasestorage.app",
            messagingSenderId: "152864778612",
            appId: "1:152864778612:web:ecc482adce93a1534a2421"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CATEGORY_NAMES = [
            "1. 안전보건경영 방침 및 목표관리 절차",
            "2. 안전보건관리책임자 등 업무수행 평가 절차",
            "3. 종사자 의견 청취 절차",
            "4. 비상사태 대비·대응 절차",
            "5. 협력사 수준관리 절차",
            "6. 안전보건관계 법령 등 이행관리 절차",
            "7. 시스템 평가 및 개선 절차"
        ];

        function getPhaseWeights(progress) {
            if (progress >= 100) return { maxSystemScore: 100, maxFieldScore: 0 };
            if (progress < 30) return { maxSystemScore: 70, maxFieldScore: 30 };
            if (progress < 80) return { maxSystemScore: 50, maxFieldScore: 50 };
            return { maxSystemScore: 60, maxFieldScore: 40 };
        }

        function toTimeMs(d) { return d.createdAt && d.createdAt.seconds ? d.createdAt.seconds : 0; }

        // 해당 분기(연도 일치)의 시스템점검 중 현장별 최신 문서만 남긴다.
        async function fetchLatestSystemChecksByQuarter(year, quarter) {
            const snap = await getDocs(query(collection(db, "shm_checks"), where("headerInfo.quarter", "==", quarter)));
            const bySite = {};
            snap.forEach(d => {
                const data = d.data();
                data._docId = d.id;
                const docYear = (data.headerInfo?.checkDate || '').slice(0, 4);
                if (docYear !== year) return;
                const name = data.headerInfo?.siteName;
                if (!name) return;
                if (!bySite[name] || toTimeMs(data) > toTimeMs(bySite[name])) bySite[name] = data;
            });
            return bySite; // { siteName: doc }
        }

        async function fetchLatestFieldChecksByQuarter(year, quarter) {
            const snap = await getDocs(query(collection(db, "field_checks"), where("headerInfo.quarter", "==", quarter)));
            const bySite = {};
            snap.forEach(d => {
                const data = d.data();
                const docYear = data.headerInfo?.year || '';
                if (docYear !== year) return;
                const name = data.headerInfo?.siteName;
                if (!name) return;
                if (!bySite[name] || toTimeMs(data) > toTimeMs(bySite[name])) bySite[name] = data;
            });
            return bySite;
        }

        // 현장별 결과 배열 생성: 구버전(통합 저장) / 신버전(시스템+현장 분리) 모두 처리
        async function computeSiteResults(year, quarter) {
            const [sysBySite, fieldBySite] = await Promise.all([
                fetchLatestSystemChecksByQuarter(year, quarter),
                fetchLatestFieldChecksByQuarter(year, quarter)
            ]);

            const results = [];
            for (const [siteName, sysDoc] of Object.entries(sysBySite)) {
                const isOld = !!(sysDoc.finalScores && sysDoc.finalScores.totalScore !== undefined);
                const majorAccident = parseInt(sysDoc.deductions?.majorAccident || '0', 10) || 0;
                const workAccident = parseInt(sysDoc.deductions?.workAccident || '0', 10) || 0;

                if (isOld) {
                    results.push({
                        siteName,
                        score: parseFloat(sysDoc.finalScores.totalScore) || 0,
                        grade: (sysDoc.finalScores.finalGrade || '-').replace('우수', '양호'),
                        majorAccident, workAccident,
                        schema: 'old',
                        fieldRaw: parseFloat(sysDoc.deductions?.fieldScore) || null,
                        fieldItems: null,
                        sectionBreakdown: null,
                        region: sysDoc.headerInfo?.region || '',
                        constructionType: sysDoc.headerInfo?.constructionType || ''
                    });
                    continue;
                }

                const progress = parseFloat(sysDoc.headerInfo?.progress) || 0;
                const weights = getPhaseWeights(progress);
                const systemRaw = Math.max(0, parseFloat(sysDoc.finalScores?.systemConverted) || 0);
                const systemConverted = (systemRaw / 100) * weights.maxSystemScore;

                const fieldDoc = fieldBySite[siteName];
                let fieldConverted = 0;
                let hasField = false;
                let fieldRawScore = null;
                if (fieldDoc) {
                    hasField = true;
                    fieldRawScore = Math.min(100, Math.max(0, parseFloat(fieldDoc.result?.totalScore) || 0));
                    fieldConverted = (fieldRawScore / 100) * weights.maxFieldScore;
                }

                const finalTotal = Math.max(0, systemConverted + fieldConverted);
                let grade = '미흡';
                if (finalTotal >= 90) grade = '양호';
                else if (finalTotal >= 60) grade = '보통';

                results.push({
                    siteName,
                    score: finalTotal,
                    grade,
                    majorAccident, workAccident,
                    schema: 'new',
                    hasField,
                    fieldRaw: fieldRawScore,
                    fieldItems: fieldDoc ? (fieldDoc.items || null) : null,
                    sectionBreakdown: sysDoc.sectionBreakdown || null,
                    region: sysDoc.headerInfo?.region || '',
                    constructionType: sysDoc.headerInfo?.constructionType || ''
                });
            }
            return results;
        }

        // 시/도별 대략적인 지도 좌표(viewBox 0 0 380 480 기준) — 정밀한 행정구역 경계가 아니라
        // 참고용 위치이며, 여러 현장이 같은 지역에 있으면 세로로 살짝 겹쳐 쌓아 표시한다.
        const SITE_REGION_COORDS = {
            '서울': { x: 155, y: 118 }, '인천': { x: 128, y: 128 }, '경기': { x: 168, y: 148 },
            '강원': { x: 245, y: 110 }, '충북': { x: 205, y: 200 }, '충남': { x: 148, y: 190 },
            '대전': { x: 190, y: 210 }, '세종': { x: 172, y: 195 }, '전북': { x: 165, y: 260 },
            '전남': { x: 140, y: 320 }, '광주': { x: 150, y: 300 }, '경북': { x: 250, y: 230 },
            '대구': { x: 240, y: 280 }, '경남': { x: 228, y: 330 }, '부산': { x: 270, y: 350 },
            '울산': { x: 275, y: 300 }, '제주': { x: 140, y: 440 }
        };

        // 대한민국 개략 윤곽선(간략화된 지도용 실루엣, 정밀 행정경계 아님)
        const KOREA_MAP_PATH = 'M120,50 L200,35 L270,55 L285,150 L290,230 L295,300 L290,340 L280,365 ' +
            'L260,380 L230,390 L200,395 L175,390 L150,378 L135,395 L120,415 L110,400 L120,380 ' +
            'L105,340 L100,290 L95,250 L85,210 L100,180 L115,160 L100,140 L115,120 L105,95 L120,70 Z';

        // 활성 현장을 지역(시/도)·공종(토목/건축)별로 묶어 지도 핀 데이터로 변환한다.
        // region이 비어있는(아직 지역 정보가 입력되지 않은) 현장은 지도에서 제외한다.
        function computeSiteMap(results) {
            const withRegion = results.filter(r => r.region && SITE_REGION_COORDS[r.region]);
            const byRegion = {};
            withRegion.forEach(r => {
                if (!byRegion[r.region]) byRegion[r.region] = [];
                byRegion[r.region].push(r);
            });
            const pins = [];
            Object.entries(byRegion).forEach(([region, sites]) => {
                const base = SITE_REGION_COORDS[region];
                sites.forEach((r, i) => {
                    const offset = (i - (sites.length - 1) / 2) * 12;
                    pins.push({
                        siteName: r.siteName,
                        region,
                        constructionType: r.constructionType || '미분류',
                        x: base.x,
                        y: base.y + offset
                    });
                });
            });
            const counts = { 토목: 0, 건축: 0, 미분류: 0 };
            pins.forEach(p => { counts[p.constructionType] = (counts[p.constructionType] || 0) + 1; });
            return { pins, counts, totalSites: results.length, mappedSites: withRegion.length };
        }

        const CONSTRUCTION_TYPE_COLOR = { 토목: '#00897b', 건축: '#3949ab', 미분류: '#999' };

        function renderSiteMap(siteMap) {
            if (siteMap.pins.length === 0) return '';
            const pinsSvg = siteMap.pins.map(p => {
                const color = CONSTRUCTION_TYPE_COLOR[p.constructionType] || '#999';
                return `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(p.siteName)}</title></circle>`;
            }).join('');

            const legendHtml = ['토목', '건축'].map(type => {
                const n = siteMap.counts[type] || 0;
                if (n === 0) return '';
                return `<div class="site-map-legend-item"><span class="site-map-dot" style="background:${CONSTRUCTION_TYPE_COLOR[type]}"></span>${escapeHtml(type)} ${n}개소</div>`;
            }).join('');

            // 지역별로 묶어 실제 현장명을 텍스트로도 함께 나열(지도만으로는 어떤 현장인지 알기 어려우므로).
            const byRegion = {};
            siteMap.pins.forEach(p => {
                if (!byRegion[p.region]) byRegion[p.region] = [];
                byRegion[p.region].push(p);
            });
            const listHtml = Object.entries(byRegion).map(([region, pins]) => {
                const items = pins.map(p => `<li><span class="site-map-dot" style="background:${CONSTRUCTION_TYPE_COLOR[p.constructionType]}"></span>${escapeHtml(p.siteName)} (${escapeHtml(p.constructionType)})</li>`).join('');
                return `<div class="site-map-region-group"><strong>${escapeHtml(region)}</strong><ul>${items}</ul></div>`;
            }).join('');

            const unmapped = siteMap.totalSites - siteMap.mappedSites;
            const unmappedNote = unmapped > 0
                ? `<p class="note">※ 지역 정보가 입력되지 않은 현장 ${unmapped}곳은 지도에 표시되지 않았습니다.</p>`
                : '';

            return `
                <div class="site-map-wrap">
                    <svg class="site-map-svg" viewBox="0 0 380 480" xmlns="http://www.w3.org/2000/svg">
                        <path d="${KOREA_MAP_PATH}" fill="#dde3f0" stroke="#b7c0da" stroke-width="1.5" />
                        ${pinsSvg}
                    </svg>
                    <div class="site-map-side">
                        <div class="site-map-legend">${legendHtml}</div>
                        <div class="site-map-list">${listHtml}</div>
                    </div>
                </div>
                ${unmappedNote}
            `;
        }

        function computeCompanyStats(results) {
            if (results.length === 0) return null;
            const avgScore = results.reduce((s, r) => s + r.score, 0) / results.length;
            const gradeCounts = { 양호: 0, 보통: 0, 미흡: 0 };
            results.forEach(r => { if (gradeCounts[r.grade] !== undefined) gradeCounts[r.grade]++; });
            const totalMajor = results.reduce((s, r) => s + r.majorAccident, 0);
            const totalWork = results.reduce((s, r) => s + r.workAccident, 0);
            return { avgScore, gradeCounts, totalMajor, totalWork, siteCount: results.length };
        }

        // 카테고리별 전사 평균 달성률(%) — 항목별 획득/배점(categoryScores)이 있는 현장은 정확한 평균 %,
        // 없는(과거) 현장은 강점/약점 이진 분류를 대략적인 %로 환산(강점=100, 약점=50)해 참고치로 사용.
        function computeCategoryAchievement(results) {
            const withBreakdown = results.filter(r => r.sectionBreakdown);
            const rows = CATEGORY_NAMES.map(name => {
                let sum = 0, n = 0, approx = false;
                const items = [];
                withBreakdown.forEach(r => {
                    const cs = (r.sectionBreakdown.categoryScores || []).find(c => c.category === name);
                    if (cs && cs.possible > 0) {
                        sum += (cs.obtained / cs.possible) * 100;
                        n++;
                    } else {
                        const isWeak = (r.sectionBreakdown.weaknesses || []).some(w => w.category === name);
                        const isStrong = (r.sectionBreakdown.strengths || []).some(s => s === name);
                        if (isWeak) { sum += 50; n++; approx = true; }
                        else if (isStrong) { sum += 100; n++; approx = true; }
                    }
                    // "미흡"으로 명확히 평가된 세부 항목(criticalIssues)을 카테고리별 지적사항
                    // 목록용으로 함께 수집한다 — 달성률(%)과 무관하게, 그 카테고리에서 구체적으로
                    // 무엇이 지적됐는지 보여주는 용도.
                    (r.sectionBreakdown.criticalIssues || []).forEach(ci => {
                        if (ci.category === name) {
                            items.push({ siteName: r.siteName, criteria: ci.criteria, comment: (ci.comment || '').trim() });
                        }
                    });
                });
                return { name, pct: n > 0 ? sum / n : null, sampleSize: n, approx, items };
            });
            return { rows, sampleSize: withBreakdown.length };
        }

        function achievementFor(categoryAchievement, name) {
            const row = categoryAchievement.rows.find(r => r.name === name);
            return row && row.pct !== null ? row.pct : null;
        }

        // Plan=계획수립(3,4,5) / Do=법령이행·책임자업무(2,6) / Check=현장확인점검(현장점검표 점수) / Action=환류활동(7)
        // 방침목표 축은 카테고리1 고유 값이 아니라, 위 4개 축(Plan/Do/Check/Action)의 종합(평균) 점수를 표시한다.
        function computePDCA(categoryAchievement, results) {
            const avgOf = names => {
                const vals = names.map(n => achievementFor(categoryAchievement, n)).filter(v => v !== null);
                return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
            };

            const plan = avgOf([CATEGORY_NAMES[2], CATEGORY_NAMES[3], CATEGORY_NAMES[4]]);
            const doVal = avgOf([CATEGORY_NAMES[1], CATEGORY_NAMES[5]]);

            const fieldScores = results.map(r => r.fieldRaw).filter(v => v !== null && v !== undefined);
            const check = fieldScores.length ? fieldScores.reduce((a, b) => a + b, 0) / fieldScores.length : null;

            const action = achievementFor(categoryAchievement, CATEGORY_NAMES[6]);

            const pdcaVals = [plan, doVal, check, action].filter(v => v !== null);
            const policy = pdcaVals.length ? pdcaVals.reduce((a, b) => a + b, 0) / pdcaVals.length : null;

            const to10 = v => v === null ? null : Math.round((v / 10) * 10) / 10;
            return {
                policy: to10(policy), plan: to10(plan), do: to10(doVal), check: to10(check), action: to10(action)
            };
        }

        // sh_check(현장점검표) 101개 항목의 사고유형(대분류) 매핑 — sh_check의 checklistData와 동일한 순서/개수로
        // index(0~100)를 사고유형에 대응시킨다.
        const HAZARD_GROUPS = [
            ['추락', 27], ['충돌 및 협착', 9], ['붕괴 및 도괴', 17],
            ['감전', 19], ['낙하 및 전도', 13], ['기타', 16]
        ];
        function buildHazardIndexMap() {
            const map = [];
            HAZARD_GROUPS.forEach(([name, count]) => { for (let i = 0; i < count; i++) map.push(name); });
            return map;
        }
        const HAZARD_INDEX_MAP = buildHazardIndexMap();

        // sh_check checklistData의 중분류명을 index(0~100) 순서로 나열 — 문항 전체 텍스트가 아닌
        // 중분류명만 담아 지적사항 상세 목록에 "어떤 설비/위치가 지적됐는지"를 가볍게 표시하는 용도.
        const HAZARD_SUBCATEGORY_MAP = ['개구부','개구부','강관 비계/시스템비계','강관 비계/시스템비계','이동식 틀비계','이동식 틀비계','이동식 틀비계','말비계','말비계','달대비계','달대비계','달대비계','사다리','사다리','작업발판','작업발판','갱폼','갱폼','갱폼','갱폼','갱폼','교량 및 철골','교량 및 철골','교량 및 철골','추락방지망','추락방지망','추락방지망','유해위험 기계기구','유해위험 기계기구','건설기계','건설기계','건설기계','건설기계','건설기계','타워크레인','타워크레인','굴착/터파기','굴착/터파기','흙막이 공사','흙막이 공사','흙막이 공사','흙막이 공사','터널작업','터널작업','터널작업','터널작업','터널작업','거푸집동바리/시스템동바리','거푸집동바리/시스템동바리','거푸집동바리/시스템동바리','거푸집동바리/시스템동바리','거푸집동바리/시스템동바리','거푸집동바리/시스템동바리','분전반/수전설비','분전반/수전설비','분전반/수전설비','분전반/수전설비','이동식 발전기','이동식 발전기','이동식 발전기','작업전선','작업전선','작업전선','교류아크 용접기','교류아크 용접기','교류아크 용접기','이동식 투광등','이동식 투광등','양수기','양수기','기타','기타','방호선반','방호선반','낙하물 방지망','낙하물 방지망','가설통로','가설통로','가설통로','가설통로','터널작업','터널작업','기타','기타','기타','화재폭발','화재폭발','화재폭발','화재폭발','화재폭발','밀폐작업','밀폐작업','밀폐작업','밀폐작업','교통안전 시설','교통안전 시설','MSDS','보건관리','개인보호구','안전의식','음주'];

        function computeHazardBreakdown(results) {
            const totals = {};
            HAZARD_GROUPS.forEach(([name]) => { totals[name] = 0; });
            const details = {};
            HAZARD_GROUPS.forEach(([name]) => { details[name] = []; });
            let sampleSize = 0;
            results.forEach(r => {
                if (!r.fieldItems) return;
                sampleSize++;
                r.fieldItems.forEach(item => {
                    const category = HAZARD_INDEX_MAP[item.index];
                    if (!category) return;
                    let count = parseInt(item.issueCount, 10) || 0;
                    // 현장에서 지적건수 칸은 비워두고 평점(상/상중/중/중하/하)만 입력하는 경우가
                    // 대부분이라(실제 데이터 확인 결과 지적건수 입력 0건), 지적건수를 아예 입력하지
                    // 않은 항목에 한해 평점이 감점(중하 -0.1 / 하 -0.3)이면 최소 1건의 지적사항이
                    // 있었던 것으로 간주해 자동 보정한다. 사용자가 지적건수를 직접 입력했다면
                    // (0을 입력한 경우 포함) 그 값을 그대로 우선한다.
                    if (count === 0 && (item.issueCount === '' || item.issueCount === null || item.issueCount === undefined)) {
                        const score = parseFloat(item.score);
                        if (!isNaN(score) && score < 0) count = 1;
                    }
                    if (count > 0) {
                        details[category].push({
                            siteName: r.siteName,
                            subcategory: HAZARD_SUBCATEGORY_MAP[item.index] || '',
                            comment: (item.comment || '').trim(),
                            photoUrl: item.photoUrl || null
                        });
                    }
                    totals[category] += count;
                });
            });
            const rows = HAZARD_GROUPS.map(([name]) => ({ name, count: totals[name], items: details[name] }))
                .sort((a, b) => b.count - a.count);
            return { rows, sampleSize };
        }

        window.__reportState = {};
        window.charts = {};

        function destroyChart(key) {
            if (window.charts[key]) { window.charts[key].destroy(); window.charts[key] = null; }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // 지적/미흡 사항 텍스트를 카테고리별로 나열하는 공용 렌더러(사고유형별 지적건수,
        // 카테고리별 달성률 두 차트에서 공유). 차트는 건수·비율만 보여주므로, 무엇이 왜
        // 지적됐는지는 이 목록으로 확인한다. DOM 텍스트로 렌더링하기 때문에 화면·인쇄 모두에서
        // 그대로 보인다(차트처럼 이미지로 바뀌지 않음). 사진은 이 텍스트 목록에는 넣지 않고
        // 별도의 "사진대지" 섹션(renderPhotoLog)에서 모아 보여준다.
        function renderDetailList(groups, accentClass) {
            const MAX_PER_GROUP = 5;
            const sections = groups
                .filter(g => g.count > 0)
                .map(g => {
                    const shown = g.items.slice(0, MAX_PER_GROUP);
                    const more = g.items.length - shown.length;
                    const itemsHtml = shown.map(label => `<li>${label}</li>`).join('');
                    const moreHtml = more > 0 ? `<li class="detail-more">외 ${more}건 더</li>` : '';
                    return `<div class="detail-group ${accentClass || ''}"><strong>${escapeHtml(g.name)} (${g.count}건)</strong><ul>${itemsHtml}${moreHtml}</ul></div>`;
                });
            if (sections.length === 0) return '';
            return `<div class="detail-list">${sections.join('')}</div>`;
        }

        function renderHazardDetailList(hazard) {
            const groups = hazard.rows.map(row => ({
                name: row.name,
                count: row.count,
                items: row.items.map(it => it.comment
                    ? `${escapeHtml(it.siteName)} - ${escapeHtml(it.subcategory)}(${escapeHtml(it.comment)})`
                    : `${escapeHtml(it.siteName)} - ${escapeHtml(it.subcategory)}`)
            }));
            return renderDetailList(groups, '');
        }

        // 사진이 첨부된 지적사항만 모아 "사진대지" 카드 목록으로 렌더링한다.
        // (현재 sh_check/현장점검표 항목만 photoUrl을 가지므로 사고유형별 지적건수에서만 나온다.)
        function collectHazardPhotos(hazard) {
            const photos = [];
            hazard.rows.forEach(row => {
                row.items.forEach(it => {
                    if (it.photoUrl) {
                        photos.push({
                            category: row.name,
                            siteName: it.siteName,
                            subcategory: it.subcategory,
                            comment: it.comment,
                            photoUrl: it.photoUrl
                        });
                    }
                });
            });
            return photos;
        }

        function renderPhotoLog(photos) {
            if (photos.length === 0) return '';
            const cards = photos.map((p, i) => {
                const commentHtml = p.comment ? `<div class="photo-log-comment">${escapeHtml(p.comment)}</div>` : '';
                return `

                            <div class="photo-log-cat">${escapeHtml(p.category)} - ${escapeHtml(p.subcategory)}</div>

                window.__reportState = { year, quarter, results };
                await renderReport(year, quarter, results);
                document.getElementById('print-btn').style.display = 'inline-block';
            } catch (error) {

                const stats = computeCompanyStats(results);
                trend.push({ label: `${year} ${q}`, avgScore: stats.avgScore });

        async function generateExecSummary(year, quarter, stats, categoryAchievement, pdca, hazard, results) {
            const btn = document.getElementById('ai-exec-btn');
            const display = document.getElementById('exec-summary-display');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = '생성 중...';
            try {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const baseUrl = isLocal
                    ? 'http://127.0.0.1:5001/namhwa-safety-dashboard/us-central1'
                    : 'https://us-central1-namhwa-safety-dashboard.cloudfunctions.net';
                const apiUrl = `${baseUrl}/generate_shm_summary`;

                const weakCategories = categoryAchievement.rows.filter(c => c.pct !== null && c.pct < 70).map(c => c.name);
                const sorted = results.slice().sort((a, b) => a.score - b.score);

                const payload = {
                    executive: true,
                    period: `${year}년 ${quarter}`,
                    siteCount: stats.siteCount,
                    avgScore: Math.round(stats.avgScore * 10) / 10,
                    gradeCounts: stats.gradeCounts,
                    majorAccidentTotal: stats.totalMajor,
                    workAccidentTotal: stats.totalWork,
                    weakCategories,
                    worstSites: sorted.slice(0, 3).map(r => ({ name: r.siteName, score: Math.round(r.score * 10) / 10, grade: r.grade })),
                    bestSites: sorted.slice(-3).reverse().map(r => ({ name: r.siteName, score: Math.round(r.score * 10) / 10, grade: r.grade })),
                    pdca: {
                        policy: pdca.policy, plan: pdca.plan, do: pdca.do, check: pdca.check, action: pdca.action
                    },
                    topHazards: hazard.rows.slice(0, 3).map(h => ({ name: h.name, count: h.count }))
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let detail = '';
                    try { detail = (await response.json()).detail || ''; } catch (e) { }
                    throw new Error(`서버 응답 오류 (${response.status}) ${detail}`);
                }

                const result = await response.json();
                if (!result.success || !result.summary) throw new Error(result.detail || '결과 값이 없습니다.');

                display.innerHTML = result.summary;
                btn.style.backgroundColor = '#2e7d32';
                btn.textContent = '✓ 생성 완료';
            } catch (error) {
                console.error('경영진 총평 생성 실패:', error);
                alert('AI 총평 생성 중 오류가 발생했습니다: ' + error.message);
                btn.textContent = '✗ 실패';
            } finally {
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.disabled = false;
                    btn.style.backgroundColor = '';
                }, 2500);
            }
        }

        document.getElementById('search-btn').addEventListener('click', runSearch);
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        // Chart.js 캔버스는 화면 폭 기준으로 렌더링된 크기를 그대로 유지하기 때문에, 인쇄 시(세로
        // A4로 폭이 좁아짐) 캔버스 자체를 그대로 인쇄에 쓰면 오른쪽이 잘리거나 다음 섹션과 겹쳐
        // 보인다. beforeprint 이벤트에서 그때그때 캔버스를 resize()하거나 이미지로 캡처해 교체하는
        // 방식을 모두 시도했지만, 브라우저의 인쇄 미리보기는 beforeprint 시점의 DOM 변경을
        // 안정적으로 반영하지 못했고(afterprint가 제때 발생하지 않아 캔버스가 계속 숨김 상태로
        // 남는 등), 그 결과 "빈 이미지" 아이콘만 보이거나 차트 자체가 사라지는 문제가 있었다.
        // 대신 차트를 만든 직후(각 차트 animation:false라 즉시 그려짐) 화면에는 안 보이는 인쇄용
        // <img>를 미리 만들어 DOM에 넣어 두고, 화면↔인쇄 전환은 순수 CSS(@media print)만으로
        // 처리한다 — JS가 인쇄 시점에 개입할 일이 전혀 없으므로 타이밍 문제 자체가 생길 수 없다.
        function refreshPrintImage(chart) {
            const box = chart.canvas.closest('.chart-box');
            if (!box) return;
            box.querySelectorAll('img.print-chart-img').forEach(img => img.remove());
            const img = document.createElement('img');
            img.className = 'print-chart-img';
            img.src = chart.toBase64Image('image/png', 1);
            box.appendChild(img);
        }

        // 년도 옵션(올해 기준 -1 ~ +1) + 오늘 기준 분기 자동 선택
        const yearSel = document.getElementById('year-search');
        const curYear = new Date().getFullYear();
        for (let y = curYear - 1; y <= curYear + 1; y++) {
            const opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = y + '년';
            if (y === curYear) opt.selected = true;
            yearSel.appendChild(opt);
        }
        document.getElementById('quarter-search').value = `${Math.ceil((new Date().getMonth() + 1) / 3)}분기`;

        // 노션 등 외부 붙여넣기 서식 방지
        document.addEventListener('paste', function (e) {
            if (!e.target.isContentEditable) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        });
    </script>
</body>
</html>
