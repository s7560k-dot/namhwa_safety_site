<head>
    <script src="/auth-guard.js"></script>

    <title>현장 안전보건경영시스템 종합결과표</title>
    <script>
        const ADMIN_PASSWORD = "1152";

        document.addEventListener('DOMContentLoaded', () => {
            const hasAuth = sessionStorage.getItem("isAdminAuthenticated") === "true";
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            const pwdInput = document.getElementById('admin-password-input');

            if (hasAuth) {
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (mainContent) mainContent.style.filter = 'blur(5px)';
                if (modal) modal.style.display = 'flex';
                if (pwdInput) {
                    pwdInput.focus();
                    pwdInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') submitAdminPassword();
                    });
                }
            }
        });

        function submitAdminPassword() {
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('password-error');
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');

            if (input.value === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuthenticated", "true");
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (error) error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
    </script>
    <style>

            margin: 20px;
            background-color: #f7f7f7;

<body>

    <div class="container" id="main-content">

        <h1>현장 안전보건경영시스템 종합결과표</h1>

        <div class="search-bar no-print">
            <label for="site-name-search">현장명</label>
            <select id="site-name-search"><option value="">불러오는 중...</option></select>
            <label for="year-search">년도</label>
            <input type="text" id="year-search" placeholder="YYYY">
            <label for="quarter-search">분기</label>
            <input type="text" id="quarter-search" value="1분기" placeholder="예: 1분기">
            <button id="search-btn" class="btn btn-search">조회</button>
            <button id="print-btn" class="btn btn-print" style="display:none;">&#128424; 인쇄하기</button>
            <button id="corrective-btn" class="btn btn-print" style="display:none; background-color:#c62828;">&#128221; 시정예방조치 요구서 출력</button>
        </div>

        <div id="result-area">
            <p style="text-align:center; color:#888; padding: 40px 0;">현장명과 년도·분기를 입력한 뒤 [조회] 버튼을 눌러주세요.</p>
        </div>

    </div>

    <!-- Loading Spinner Overlay -->
    <div id="loading-overlay"
        style="display: none; position: fixed; inset: 0; background-color: rgba(255, 255, 255, 0.8); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
        <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px; font-weight: bold; color: #333;">조회 중...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbVG3iL3FBJe6alPLZnhFW_QAGpzeqFoY",
            authDomain: "namhwa-safety-dashboard.firebaseapp.com",
            projectId: "namhwa-safety-dashboard",
            storageBucket: "namhwa-safety-dashboard.firebasestorage.app",
            messagingSenderId: "152864778612",
            appId: "1:152864778612:web:ecc482adce93a1534a2421"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 공정율에 따른 시스템:현장 반영 비율 (기존 shm_system 로직과 동일하게 유지)
        function getPhaseWeights(progress) {
            // 공정율 100%(준공)는 물리적으로 더 이상 점검할 현장이 없어 현장점검 점수가 항상 0으로
            // 잡히므로, 이를 종합점수에 반영하면 부당하게 깎이게 된다. 준공 현장은 시스템 점검만으로 평가.
            if (progress >= 100) {
                return { maxSystemScore: 100, maxFieldScore: 0, phaseText: "준공 단계 (시스템 점검만 반영)", phaseClass: "phase-complete" };
            }
            if (progress < 30) {
                return { maxSystemScore: 70, maxFieldScore: 30, phaseText: "초기 단계 (시스템70:현장30)", phaseClass: "phase-early" };
            } else if (progress < 80) {
                return { maxSystemScore: 50, maxFieldScore: 50, phaseText: "본 공사 단계 (시스템50:현장50)", phaseClass: "phase-middle" };
            }
            return { maxSystemScore: 60, maxFieldScore: 40, phaseText: "마무리 단계 (시스템60:현장40)", phaseClass: "phase-late" };
        }

        function toTimeMs(doc) {
            return doc.createdAt && doc.createdAt.seconds ? doc.createdAt.seconds : 0;
        }

        // siteName으로만 서버에 조회(색인 불필요)한 뒤, 년도/분기 일치 + 최신순으로 클라이언트에서 필터링
        async function findLatestSystemCheck(siteName, year, quarter) {
            const q = query(collection(db, "shm_checks"), where("headerInfo.siteName", "==", siteName));
            const snap = await getDocs(q);
            let candidates = [];
            snap.forEach(d => {
                const data = d.data();
                data._docId = d.id;
                const docYear = (data.headerInfo?.checkDate || '').slice(0, 4);
                const docQuarter = data.headerInfo?.quarter || '';
                if (docYear === year && docQuarter === quarter) candidates.push(data);
            });
            candidates.sort((a, b) => toTimeMs(b) - toTimeMs(a));
            return candidates[0] || null;
        }

        async function findLatestFieldCheck(siteName, year, quarter) {
            const q = query(collection(db, "field_checks"), where("headerInfo.siteName", "==", siteName));
            const snap = await getDocs(q);
            let candidates = [];
            snap.forEach(d => {
                const data = d.data();
                const docYear = data.headerInfo?.year || '';
                const docQuarter = data.headerInfo?.quarter || '';
                if (docYear === year && docQuarter === quarter) candidates.push(data);
            });
            candidates.sort((a, b) => toTimeMs(b) - toTimeMs(a));
            return candidates[0] || null;
        }

        // 현장명 목록은 매번 shm_checks/field_checks 컬렉션 전체를 훑지 않고,
        // 저장할 때마다 이름만 누적해두는 별도의 작은 캐시 문서(metadata/site_names)에서 읽는다.
        async function loadSiteNameOptions() {
            const select = document.getElementById('site-name-search');
            try {
                const snap = await getDoc(doc(db, "metadata", "site_names"));
                const names = new Set(snap.exists() ? (snap.data().names || []) : []);

                const sorted = Array.from(names).sort((a, b) => a.localeCompare(b, 'ko'));
                if (sorted.length === 0) {
                    select.innerHTML = '<option value="">저장된 현장이 없습니다</option>';
                    return;
                }
                select.innerHTML = '<option value="">현장을 선택하세요</option>' +
                    sorted.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
            } catch (error) {
                console.error('현장명 목록 조회 실패:', error);
                select.innerHTML = '<option value="">현장 목록을 불러오지 못했습니다</option>';
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function renderMissing(systemDoc, fieldDoc, siteName, year, quarter) {
            const area = document.getElementById('result-area');
            let msg = `<div class="status-message status-warn">`;
            msg += `${escapeHtml(siteName)} / ${escapeHtml(year)}년 ${escapeHtml(quarter)} 종합결과를 계산할 수 없습니다.<br><br>`;
            msg += `- 시스템 점검표 저장 데이터: ${systemDoc ? '있음 ✅' : '없음 ❌ (시스템점검표에서 저장 필요)'}<br>`;
            msg += `- 현장 점검표 저장 데이터: ${fieldDoc ? '있음 ✅' : '없음 ❌ (현장점검표에서 저장 필요)'}<br><br>`;
            msg += `두 점검 결과가 모두 저장되어야 종합결과표가 자동으로 계산됩니다.`;
            msg += `</div>`;

            if (systemDoc) {
                const raw = parseFloat(systemDoc.finalScores?.systemConverted) || 0;
                msg += `<div class="status-message status-ok">참고: 시스템 점검 점수 (100점 만점) = ${raw.toFixed(1)}점</div>`;
            }
            if (fieldDoc) {
                const raw = parseFloat(fieldDoc.result?.totalScore) || 0;
                msg += `<div class="status-message status-ok">참고: 현장 점검 점수 (100점 만점 기준) = ${raw.toFixed(1)}점</div>`;
            }

            area.innerHTML = msg;
            document.getElementById('print-btn').style.display = 'none';
            document.getElementById('corrective-btn').style.display = 'none';
        }

        function renderResult(systemDoc, fieldDoc, siteName, year, quarter) {
            const progress = parseFloat(systemDoc.headerInfo?.progress) || 0;
            const weights = getPhaseWeights(progress);

            const systemRaw = Math.max(0, parseFloat(systemDoc.finalScores?.systemConverted) || 0);
            const systemConverted = (systemRaw / 100) * weights.maxSystemScore;

            const fieldRaw = Math.min(100, Math.max(0, parseFloat(fieldDoc.result?.totalScore) || 0));
            const fieldConverted = (fieldRaw / 100) * weights.maxFieldScore;

            const finalTotal = Math.max(0, systemConverted + fieldConverted);

            let grade = '미흡', gradeClass = 'poor';
            if (finalTotal >= 90) { grade = '우수'; gradeClass = 'excellent'; }
            else if (finalTotal >= 60) { grade = '보통'; gradeClass = 'good'; }

            const manager = systemDoc.headerInfo?.evaluators?.manager || '';
            const safetyManager = systemDoc.headerInfo?.evaluators?.safetyManager || '';
            const supervisors = (systemDoc.headerInfo?.evaluators?.supervisors || []).join(', ');
            const department = systemDoc.headerInfo?.department || '';
            const checkDate = systemDoc.headerInfo?.checkDate || '';

            const inspectors = (systemDoc.signatures?.inspectors || []);
            const evaluators = (systemDoc.signatures?.evaluators || []);
            const siteRep = systemDoc.signatures?.siteRep || '';
            const majorSummary = (systemDoc.majorSummary || '').trim();

            const area = document.getElementById('result-area');
            area.innerHTML = `
                <table class="header-table">
                    <colgroup>
                        <col style="width: 15%;"><col style="width: 35%;"><col style="width: 15%;"><col style="width: 35%;">
                    </colgroup>
                    <tr>
                        <th>현장명</th><td class="text-left">${escapeHtml(siteName)}</td>
                        <th>점검일(시스템/현장)</th><td class="text-left">${escapeHtml(checkDate)}</td>
                    </tr>
                    <tr>
                        <th>공정율</th>
                        <td class="text-left">${progress.toFixed(1)}% <span id="evaluation-phase-badge" class="${weights.phaseClass}">${weights.phaseText}</span></td>
                        <th>작성부서</th><td class="text-left">${escapeHtml(department)}</td>
                    </tr>
                    <tr>
                        <th>현장소장</th><td class="text-left">${escapeHtml(manager)}</td>
                        <th>안전관리자</th><td class="text-left">${escapeHtml(safetyManager)}</td>
                    </tr>
                    <tr>
                        <th>관리감독자</th><td class="text-left" colspan="3">${escapeHtml(supervisors)}</td>
                    </tr>
                </table>

                <div class="section-title">종합 결과</div>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>구분</th><th>배점</th><th>점수(100점 기준)</th><th>환산점수</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>안전보건경영시스템 점검</td>
                            <td>${weights.maxSystemScore}점 만점</td>
                            <td>${systemRaw.toFixed(1)}</td>
                            <td style="font-weight:bold;">${systemConverted.toFixed(1)}</td>
                        </tr>
                        <tr>
                            <td>현장 안전관리 점검</td>
                            <td>${weights.maxFieldScore}점 만점</td>
                            <td>${fieldRaw.toFixed(1)}</td>
                            <td style="font-weight:bold;">${fieldConverted.toFixed(1)}</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr><th colspan="3">총점</th><th id="final-total-score" style="font-size:1.2em;">${finalTotal.toFixed(1)}</th></tr>
                        <tr><th colspan="3">평가등급</th><th id="final-grade-display" class="${gradeClass}" style="font-size:1.2em;">${grade}</th></tr>
                    </tfoot>
                </table>

                <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>주요 공정/ 개선 요구 사항</span>
                    <div class="no-print" style="display:flex; gap:8px;">
                        <button type="button" id="ai-summary-btn"
                            style="padding: 4px 10px; font-size: 0.8em; cursor: pointer; background-color: #3949ab; color: white; border: none; border-radius: 4px; font-weight: bold;">
                            &#9881; AI 개선사항 자동 종합 (시스템+현장 합산)
                        </button>
                        <button type="button" id="save-summary-btn"
                            style="padding: 4px 10px; font-size: 0.8em; cursor: pointer; background-color: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold;">
                            &#128190; 내용 저장
                        </button>
                    </div>
                </div>
                <div id="major-summary-display" contenteditable="true"
                    data-placeholder="작성된 내용이 없습니다. 위 [AI 개선사항 자동 종합] 버튼으로 생성하거나 이 영역을 직접 클릭해 입력할 수 있습니다."
                    style="padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #fff; min-height: 40px; white-space: pre-wrap; line-height: 1.6; cursor: text;">${majorSummary}</div>
                <p class="no-print" style="font-size: 0.8em; color: #888; margin-top: 4px; margin-bottom: 0;">※ 이 영역을 직접 클릭해 내용을 수정한 뒤 [내용 저장]을 눌러 반영하세요. (버튼과 이 안내문은 인쇄물에는 포함되지 않습니다)</p>

                <div class="signature-section">
                    <div style="margin-bottom: 10px; font-weight: bold;">■ 평가 서명란</div>
                    <div>
                        ${inspectors.length ? inspectors.map(n => `<span class="sig-row">${escapeHtml(n)} (서명)</span>`).join('') : '<span class="sig-row" style="color:#999;">수검 참여자 정보 없음</span>'}
                    </div>
                    <div style="border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px;">
                        <span class="sig-row"><strong>수검 현장 대표:</strong> ${escapeHtml(siteRep)} (서명)</span>
                        <div style="margin-top: 10px;">
                            ${evaluators.length ? evaluators.map(n => `<span class="sig-row">${escapeHtml(n)} (서명)</span>`).join('') : '<span class="sig-row" style="color:#999;">점검자 정보 없음</span>'}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('print-btn').style.display = 'inline-block';

            const correctiveBtn = document.getElementById('corrective-btn');
            correctiveBtn.style.display = 'inline-block';
            correctiveBtn.onclick = () => {
                const params = new URLSearchParams({ site: siteName, year, quarter });
                window.open('/shm_corrective/?' + params.toString(), '_blank');
            };

            document.getElementById('ai-summary-btn').addEventListener('click', () => {
                generateAiSummary(systemDoc, finalTotal, siteName, grade);
            });

            document.getElementById('save-summary-btn').addEventListener('click', () => {
                saveMajorSummaryEdit(systemDoc);
            });

            // 전체 삭제 시 브라우저가 남기는 빈 <br>을 정리해 placeholder(:empty)가 정상 표시되게 함
            document.getElementById('major-summary-display').addEventListener('input', function () {
                if (this.textContent.trim() === '') this.innerHTML = '';
            });
        }

        async function saveMajorSummaryEdit(systemDoc) {
            const btn = document.getElementById('save-summary-btn');
            const display = document.getElementById('major-summary-display');

            if (!systemDoc._docId) {
                alert('저장 대상 시스템점검표 문서를 찾을 수 없습니다.');
                return;
            }

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = '저장 중...';

            try {
                const editedHtml = display.innerHTML.trim();
                await updateDoc(doc(db, "shm_checks", systemDoc._docId), { majorSummary: editedHtml });
                systemDoc.majorSummary = editedHtml;
                btn.textContent = '✓ 저장됨';
            } catch (error) {
                console.error('저장 실패:', error);
                alert('저장 중 오류가 발생했습니다: ' + error.message);
                btn.textContent = '✗ 저장 실패';
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2000);
            }
        }

        async function generateAiSummary(systemDoc, finalTotal, siteName, grade) {
            const btn = document.getElementById('ai-summary-btn');
            const display = document.getElementById('major-summary-display');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.style.backgroundColor = '#f57c00';
            btn.innerHTML = '<span style="display:inline-block; width:12px; height:12px; border:2px solid #fff; border-radius:50%; border-top-color:transparent; animation:spin 1s linear infinite; vertical-align:middle; margin-right:5px;"></span> AI 분석 중...';

            try {
                const breakdown = systemDoc.sectionBreakdown || { strengths: [], weaknesses: [] };

                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const baseUrl = isLocal
                    ? 'http://127.0.0.1:5001/namhwa-safety-dashboard/us-central1'
                    : 'https://us-central1-namhwa-safety-dashboard.cloudfunctions.net';
                const apiUrl = `${baseUrl}/generate_shm_summary`;

                const payload = {
                    siteName: siteName,
                    finalScore: Math.round(finalTotal * 10) / 10,
                    grade: grade, // '우수'/'보통'/'미흡' — 현장 전체 등급에 따라 AI 톤 모드 결정
                    progress: parseFloat(systemDoc.headerInfo?.progress) || 0, // 공정율 100%(완공)이면 노고 치하 톤으로 전환
                    strengths: breakdown.strengths || [],
                    weaknesses: breakdown.weaknesses || [],
                    criticalIssues: breakdown.criticalIssues || []
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errorDetail = "";
                    try {
                        const errorJson = await response.json();
                        errorDetail = errorJson.detail || "";
                    } catch (e) { }
                    throw new Error(`서버 응답 오류 (상태 코드: ${response.status}) ${errorDetail ? '\n상세: ' + errorDetail : ''}`);
                }

                const result = await response.json();
                if (!result.success || !result.summary) {
                    throw new Error(result.detail || "결과 값이 없습니다.");
                }

                display.innerHTML = result.summary;

                // 생성된 종합 검토 내용을 시스템점검표 저장 데이터에도 반영 (다음 조회 시 재사용)
                if (systemDoc._docId) {
                    await updateDoc(doc(db, "shm_checks", systemDoc._docId), { majorSummary: result.summary });
                }

                btn.style.backgroundColor = '#4caf50';
                btn.textContent = "✓ 분석 완료";
            } catch (error) {
                console.error("AI 요약 실패:", error);
                alert(`AI 요약을 생성하는 중에 오류가 발생했습니다.\n상세: ${error.message}`);
                btn.style.backgroundColor = '#d32f2f';
                btn.textContent = "✗ 분석 실패";
            } finally {
                setTimeout(() => {
                    btn.style.backgroundColor = '#3949ab';
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }, 3000);
            }
        }

        async function runSearch() {
            const siteName = document.getElementById('site-name-search').value.trim();
            const year = document.getElementById('year-search').value.trim();
            const quarter = document.getElementById('quarter-search').value.trim();

            if (!siteName || !year || !quarter) {
                alert('현장명, 년도, 분기를 모두 입력해주세요.');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'flex';
            document.getElementById('print-btn').style.display = 'none';
            document.getElementById('corrective-btn').style.display = 'none';

            try {
                const [systemDoc, fieldDoc] = await Promise.all([
                    findLatestSystemCheck(siteName, year, quarter),
                    findLatestFieldCheck(siteName, year, quarter)
                ]);

                if (systemDoc && fieldDoc) {
                    renderResult(systemDoc, fieldDoc, siteName, year, quarter);
                } else {
                    renderMissing(systemDoc, fieldDoc, siteName, year, quarter);
                }
            } catch (error) {
                console.error('종합결과 조회 실패:', error);
                document.getElementById('result-area').innerHTML =
                    `<div class="status-message status-warn">조회 중 오류가 발생했습니다: ${escapeHtml(error.message)}</div>`;
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        document.getElementById('search-btn').addEventListener('click', runSearch);
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        // 현재 날짜 기준 분기 자동 설정
        const currentMonth = new Date().getMonth() + 1;
        const currentQuarter = Math.ceil(currentMonth / 3);
        document.getElementById('quarter-search').value = `${currentQuarter}분기`;
        document.getElementById('year-search').value = String(new Date().getFullYear());

        loadSiteNameOptions();

        // 노션 등 외부에서 복사한 서식(테두리/배경 등)이 그대로 붙여넣어지는 것을 방지 — 항상 순수 텍스트로만 붙여넣기
        document.addEventListener('paste', function (e) {
            if (!e.target.isContentEditable) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        });
    </script>

            <button onclick="submitAdminPassword()"
