    <script>
        const ADMIN_PASSWORD = "1152";

        document.addEventListener('DOMContentLoaded', () => {
            const hasAuth = sessionStorage.getItem("isAdminAuthenticated") === "true";
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');
            const pwdInput = document.getElementById('admin-password-input');

            if (hasAuth) {
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (mainContent) mainContent.style.filter = 'blur(5px)';
                if (modal) modal.style.display = 'flex';
                if (pwdInput) {
                    pwdInput.focus();
                    pwdInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') submitAdminPassword();
                    });
                }
            }
        });

        function submitAdminPassword() {
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('password-error');
            const modal = document.getElementById('password-modal');
            const mainContent = document.getElementById('main-content');

            if (input.value === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuthenticated", "true");
                if (modal) modal.style.display = 'none';
                if (mainContent) mainContent.style.filter = 'none';
            } else {
                if (error) error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
    </script>

        function flattenSystemRows() {
            const flat = [];
            SECTIONS_DATA.forEach(section => {
                section.rows.forEach(row => flat.push(row));
            });
            return flat;
        }

        function flattenFieldItems() {
            const flat = [];
            CHECKLIST_DATA.forEach(sc => {
                for (let i = 0; i < sc.count; i++) {
                    flat.push({ category: sc.category, subcategory: sc.subcategory, criteria: sc.items[i] });
                }
            });
            return flat;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // contenteditable로 저장된 코멘트(innerHTML)를 사람이 읽는 일반 텍스트로 변환
        function htmlToPlainText(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            tmp.querySelectorAll('br, div, p').forEach(el => el.replaceWith(' ' + (el.textContent || '')));
            return tmp.textContent.replace(/\s+/g, ' ').trim();
        }

        function toTimeMs(doc) {
            return doc.createdAt && doc.createdAt.seconds ? doc.createdAt.seconds : 0;
        }

        async function findLatestSystemCheck(siteName, year, quarter) {
            const q = query(collection(db, "shm_checks"), where("headerInfo.siteName", "==", siteName));
            const snap = await getDocs(q);
            let candidates = [];
            snap.forEach(d => {
                const data = d.data();
                const docYear = (data.headerInfo?.checkDate || '').slice(0, 4);
                const docQuarter = data.headerInfo?.quarter || '';
                if (docYear === year && docQuarter === quarter) candidates.push(data);
            });
            candidates.sort((a, b) => toTimeMs(b) - toTimeMs(a));
            return candidates[0] || null;
        }

            const q = query(collection(db, "field_checks"), where("headerInfo.siteName", "==", siteName));
            const snap = await getDocs(q);
            let candidates = [];
            snap.forEach(d => {
                const data = d.data();
                const docYear = data.headerInfo?.year || '';
                const docQuarter = data.headerInfo?.quarter || '';
                if (docYear === year && docQuarter === quarter) candidates.push(data);
            });
            candidates.sort((a, b) => toTimeMs(b) - toTimeMs(a));
            return candidates[0] || null;
        }

        // 현장점검표의 평점 척도(상/상중/중/중하/하)에는 "미흡" 라벨이 없어, 부정적 평점인
        // 중하(-0.1)·하(-0.3)를 미흡으로 간주한다. 또한 실제 현장에서 사진으로 확인된 항목만
        // 지적사항으로 인정한다(사진 미첨부시 근거 부족으로 제외).
        const FIELD_POOR_SCORES = ['-0.1', '-0.3'];

        function buildDeficiencyLines(systemDoc, fieldDoc) {
            const lines = [];

            if (systemDoc && Array.isArray(systemDoc.evaluationItems)) {
                const flatSys = flattenSystemRows();
                systemDoc.evaluationItems.forEach(item => {
                    const rowDef = flatSys[item.index];
                    if (!rowDef) return;
                    const worst = rowDef.options.find(o => o.t === '미흡');
                    if (!worst) return;
                    if (parseFloat(item.selectedValue) !== worst.v) return;
                    const comment = htmlToPlainText(item.comment);
                    let text = `[시스템점검] ${rowDef.criteria}`;
                    if (comment) text += ` - ${comment}`;
                    lines.push({ text, photoUrl: null });
                });
            }

            if (fieldDoc && Array.isArray(fieldDoc.items)) {
                const flatField = flattenFieldItems();
                fieldDoc.items.forEach(item => {
                    if (!FIELD_POOR_SCORES.includes(item.score)) return;
                    if (!item.photoUrl) return;
                    const rowDef = flatField[item.index];
                    if (!rowDef) return;
                    const comment = (item.comment || '').trim();
                    const cnt = parseInt(item.issueCount, 10);
                    let text = `[현장점검/${rowDef.category}·${rowDef.subcategory}] ${rowDef.criteria}`;
                    if (cnt > 0) text += ` (지적 ${cnt}건)`;
                    if (comment) text += ` - ${comment}`;
                    lines.push({ text, photoUrl: item.photoUrl });
                });
            }

            return lines;
        }

        function todayStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}. ${pad(d.getMonth() + 1)}. ${pad(d.getDate())}.`;
        }

        function renderResult(systemDoc, fieldDoc, siteName, year, quarter) {
            const area = document.getElementById('result-area');

            if (!systemDoc && !fieldDoc) {
                area.innerHTML = `<div class="status-message">${escapeHtml(siteName)} / ${escapeHtml(year)}년 ${escapeHtml(quarter)}에 저장된 시스템점검표·현장점검표 데이터가 없습니다.<br>먼저 시스템점검표 또는 현장점검표를 저장해 주세요.</div>`;
                document.getElementById('print-btn').style.display = 'none';
                return;
            }

            const deficiencyLines = buildDeficiencyLines(systemDoc, fieldDoc);
            const deficiencyHtml = deficiencyLines.length
                ? deficiencyLines.map((line, i) => `${i + 1}. ${escapeHtml(line.text)}`).join('<br><br>')
                : '';

            const photoItems = deficiencyLines
                .map((line, i) => ({ num: i + 1, ...line }))
                .filter(line => line.photoUrl);
            const photoSectionHtml = photoItems.length ? `
                <div class="section-label" style="margin-top: 18px; page-break-before: always;">점검 사진 대지</div>
                <div class="photo-grid">
                    ${photoItems.map(p => `
                        <div class="photo-card">
                            <img src="${p.photoUrl}" alt="점검 사진 ${p.num}">
                            <div class="photo-caption">${p.num}. ${escapeHtml(p.text)}</div>
                        </div>
                    `).join('')}
                </div>
            ` : '';

            const manager = systemDoc?.headerInfo?.evaluators?.manager || '';
            const department = systemDoc?.headerInfo?.department || '안전보건팀';

            const defaultCriteria = [
                '안전보건경영시스템',
                '4. NC-OHSMS-P610_위험성평가 절차서',
                '7. NC-OHSMS-P710 안전보건 교육훈련 절차서',
                '17. NC-OHSMS-P1010_사건, 부적합 및 시정조치 절차서',
                '22. NC-OHSMS-P1600_현장 안전보건 업무수행 절차서'
            ].join('<br>');

            area.innerHTML = `
                <h1>안전보건 시정/예방지시서</h1>

                <table>
                    <colgroup>
                        <col style="width: 18%;"><col style="width: 32%;"><col style="width: 18%;"><col style="width: 32%;">
                    </colgroup>
                    <tr>
                        <th>일련번호</th>
                        <td><input type="text" id="doc-no" class="input-text" placeholder="예: 20260601" autocomplete="off"></td>
                        <th>현장명</th>
                        <td class="text-left" style="padding-left: 14px;">${escapeHtml(siteName)}</td>
                    </tr>
                    <tr>
                        <th>발행일자</th>
                        <td><input type="text" id="issue-date" class="input-text" value="${todayStr()}" autocomplete="off"></td>
                        <th>조치요청일자</th>
                        <td><input type="text" id="due-date" class="input-text" placeholder="예: 2026. 06. 08." autocomplete="off"></td>
                    </tr>
                    <tr>
                        <th>작성자</th>
                        <td><input type="text" id="writer" class="input-text" value="${escapeHtml(department)} " autocomplete="off"></td>
                        <th>담당자</th>
                        <td><input type="text" id="manager-name" class="input-text" autocomplete="off"></td>
                    </tr>
                    <tr>
                        <th>현장 소장</th>
                        <td colspan="3" class="text-left" style="padding-left: 14px;">${escapeHtml(manager)} (서명)</td>
                    </tr>
                </table>

                <div class="intro-text">
                    시정/예방조치활동 운영지침에 의거 <b>${escapeHtml(year)}년 ${escapeHtml(quarter)}</b> 안전점검 결과 아래의 지적된 부적합사항에 대하여
                    시정/예방조치 후 기한 내 회신 바랍니다.
                </div>

                <div class="section-label">부적합사항</div>
                <div id="deficiency-list" contenteditable="true" data-placeholder="확인된 부적합사항이 없습니다. 필요시 이 영역을 직접 클릭해 입력할 수 있습니다.">${deficiencyHtml}</div>

                <div class="section-label" style="margin-top: 18px;">조치기준</div>
                <div id="criteria-list" contenteditable="true">${defaultCriteria}</div>

                <table class="approval-table" style="margin-top: 18px;">
                    <colgroup>
                        <col style="width: 34%;"><col style="width: 16.5%;"><col style="width: 16.5%;"><col style="width: 16.5%;"><col style="width: 16.5%;">
                    </colgroup>
                    <tr>
                        <td class="note-cell" rowspan="3">
                            * 기한 내 미보고시 작업중지<br>
                            * 첨부 : <input type="text" class="input-text no-print-border" id="attachment-note" style="width:60%; display:inline-block;" placeholder="예: 점검사진 대지" autocomplete="off">
                        </td>
                        <th>작성</th>
                        <th>검토</th>
                        <th>조정</th>
                        <th>승인</th>
                    </tr>
                    <tr>
                        <td class="name-cell"><input type="text" class="input-text" autocomplete="off"></td>
                        <td class="name-cell"><input type="text" class="input-text" autocomplete="off"></td>
                        <td class="name-cell"><input type="text" class="input-text" autocomplete="off"></td>
                        <td class="name-cell"><input type="text" class="input-text" autocomplete="off"></td>
                    </tr>
                    <tr>
                        <td><input type="text" class="input-text" placeholder="날짜" autocomplete="off"></td>
                        <td><input type="text" class="input-text" placeholder="날짜" autocomplete="off"></td>
                        <td><input type="text" class="input-text" placeholder="날짜" autocomplete="off"></td>
                        <td><input type="text" class="input-text" placeholder="날짜" autocomplete="off"></td>
                    </tr>
                </table>

                <div class="footer-logo">
                    <img src="https://github.com/s7560k-dot/my-image/blob/main/remove_background.webp?raw=true" alt="회사 로고" onerror="this.style.display='none'">
                </div>

                ${photoSectionHtml}
            `;

            document.getElementById('print-btn').style.display = 'inline-block';
        }

        async function runSearch() {
            const siteName = document.getElementById('site-name-search').value.trim();
            const year = document.getElementById('year-search').value.trim();
            const quarter = document.getElementById('quarter-search').value.trim();

            if (!siteName || !year || !quarter) {
                alert('현장명, 년도, 분기를 모두 입력해주세요.');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'flex';
            document.getElementById('print-btn').style.display = 'none';

            try {
                const [systemDoc, fieldDoc] = await Promise.all([
                    findLatestSystemCheck(siteName, year, quarter),
                    findLatestFieldCheck(siteName, year, quarter)
                ]);
                renderResult(systemDoc, fieldDoc, siteName, year, quarter);
            } catch (error) {
                console.error('시정예방조치 요구서 조회 실패:', error);
                document.getElementById('result-area').innerHTML =
                    `<div class="status-message">조회 중 오류가 발생했습니다: ${escapeHtml(error.message)}</div>`;
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        async function loadSiteNameOptions(preselect) {
            const select = document.getElementById('site-name-search');
            try {
                const [sysSnap, fieldSnap] = await Promise.all([
                    getDocs(collection(db, "shm_checks")),
                    getDocs(collection(db, "field_checks"))
                ]);
                const names = new Set();
                sysSnap.forEach(d => { const n = d.data().headerInfo?.siteName; if (n) names.add(n); });
                fieldSnap.forEach(d => { const n = d.data().headerInfo?.siteName; if (n) names.add(n); });

                const sorted = Array.from(names).sort((a, b) => a.localeCompare(b, 'ko'));
                select.innerHTML = '<option value="">현장을 선택하세요</option>' +
                    sorted.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
                if (preselect && sorted.includes(preselect)) select.value = preselect;
            } catch (error) {
                console.error('현장명 목록 조회 실패:', error);
                select.innerHTML = '<option value="">현장 목록을 불러오지 못했습니다</option>';
            }
        }

        document.getElementById('search-btn').addEventListener('click', runSearch);
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        // 종합결과표(/shm_result/)에서 "시정예방조치 요구서 출력" 버튼으로 넘어온 경우
        // URL 쿼리(site/year/quarter)를 그대로 받아 자동 조회
        (async function initFromQuery() {
            const params = new URLSearchParams(location.search);
            const site = params.get('site') || '';
            const year = params.get('year') || '';
            const quarter = params.get('quarter') || '';

            await loadSiteNameOptions(site);

            if (year) document.getElementById('year-search').value = year;
            if (quarter) document.getElementById('quarter-search').value = quarter;
            else {
                const currentMonth = new Date().getMonth() + 1;
                document.getElementById('quarter-search').value = `${Math.ceil(currentMonth / 3)}분기`;
            }
            if (!year) document.getElementById('year-search').value = String(new Date().getFullYear());

            if (site && year) {
                runSearch();
            }
        })();
    </script>

    <!-- 관리자 비밀번호 입력 모달 -->
    <div id="password-modal" style="display:none; position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.75); align-items: center; justify-content: center; z-index: 9999; padding: 20px;">
        <div style="background-color: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); text-align: center; width: 100%; max-width: 400px; border: 1px solid #f1f5f9; box-sizing: border-box; font-family: sans-serif;">
            <div style="width: 64px; height: 64px; background-color: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #2563eb;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 32px; height: 32px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <h2 style="font-size: 24px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">관리자 인증</h2>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 24px 0; line-height: 1.5;">페이지에 접근하려면 관리자 비밀번호를 입력해 주세요.</p>
            <div style="margin-bottom: 24px;">
                <input type="password" id="admin-password-input"
                    style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; text-align: center; font-family: monospace; font-size: 24px; letter-spacing: 0.25em; box-sizing: border-box;"
                    placeholder="••••" autofocus>
                <p id="password-error" style="color: #ef4444; font-size: 12px; margin-top: 8px; display: none; font-weight: 600;">비밀번호가 일치하지 않습니다.</p>
            </div>
            <button onclick="submitAdminPassword()"
                style="width: 100%; background-color: #2563eb; color: #ffffff; font-weight: 700; padding: 14px 24px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px;">
                인증하기
            </button>
        </div>
    </div>
</body>
