<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험성 평가</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* [수정] 모바일 뷰에서 입력란이 100% 너비를 갖도록 보장 */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            color: #333;
            background-color: #f0f2f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 14px;
            word-break: keep-all;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        
        .approval-table-container {
            width: 33%;
            flex-shrink: 0;
        }
        .approval-table th, .approval-table td {
            padding: 4px;
            font-size: 12px;
        }
        .approval-table input[type="date"] {
            width: 100%;
            border: none;
            text-align: center;
            font-size: 12px;
        }
        .main-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-title select {
            width: auto;
            font-size: 14px;
            font-weight: normal;
            margin-right: 10px;
            padding: 2px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input, textarea, select {
            width: 100%;
        }
        
        /* 입력란 스타일 */
        td input, td textarea, td select {
            border: 1px solid #ccc;
            padding: 4px;
            border-radius: 4px;
        }
        /* PC/태블릿 뷰에서 높이 통일 */
        @media screen and (min-width: 769px) {
            td input, td textarea, td select {
                 min-height: 50px;
            }
             /* 너비가 좁은 열은 높이 통일 제외 */
            .col-narrow input {
                min-height: auto;
            }
        }
        /* 상단 정보 테이블은 높이 통일 제외 */
        .info-table td input {
            min-height: auto;
            border: 1px solid #ccc;
        }
        
        textarea {
            resize: vertical;
        }
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f1f1; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .overflow-x-auto::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .action-button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-align: center;
            font-size: 14px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }

        /* 저장/초기화 버튼 색상 추가 */
        .bg-blue-500 { background-color: #3b82f6; }
        .hover\:bg-blue-600:hover { background-color: #2563eb; }
        .bg-red-500 { background-color: #ef4444; }
        .hover\:bg-red-600:hover { background-color: #dc2626; }
        .bg-purple-500 { background-color: #8b5cf6; }
        .hover\:bg-purple-600:hover { background-color: #7c3aed; }

        /* 공종별 유해위험요인 선택 모달 */
        .hazard-modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .hazard-modal-overlay.open {
            display: flex;
        }
        .hazard-modal-box {
            background: #fff;
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .hazard-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        .hazard-modal-header h3 {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
        .hazard-modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: #6b7280;
        }
        .hazard-major-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            flex-shrink: 0;
        }
        .hazard-major-tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            cursor: pointer;
        }
        .hazard-major-tab-btn:hover {
            background-color: #f3f4f6;
        }
        .hazard-major-tab-btn.active {
            background-color: #1f2937;
            border-color: #1f2937;
            color: #fff;
        }
        .hazard-modal-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        .hazard-category-panel {
            width: 38%;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            padding: 8px;
            flex-shrink: 0;
        }
        .hazard-item-panel {
            width: 62%;
            overflow-y: auto;
            padding: 16px;
        }
        .hazard-category-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .hazard-category-btn:hover {
            background-color: #f3f4f6;
        }
        .hazard-category-btn.active {
            background-color: #3b82f6;
            color: #fff;
            font-weight: bold;
        }
        .hazard-item-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .hazard-item-card:hover {
            background-color: #eff6ff;
        }
        .hazard-item-card input[type="checkbox"] {
            width: auto;
            margin-top: 3px;
            flex-shrink: 0;
        }
        .hazard-item-risk {
            font-weight: bold;
            font-size: 13px;
            color: #1f2937;
        }
        .hazard-item-measure {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        .hazard-modal-footer {
            padding: 12px 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .hazard-modal-body { flex-direction: column; }
            .hazard-category-panel, .hazard-item-panel { width: 100%; }
            .hazard-category-panel { border-right: none; border-bottom: 1px solid #e5e7eb; max-height: 30vh; }
        }
        
        /* 삭제 버튼 스타일 */
        .delete-btn {
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }


        .print-btn-container {
            text-align: right;
            max-width: 1600px;
            margin: 20px auto 0;
            padding: 0 20px;
        }
        .image-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 5px;
        }
        .image-preview {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
            display: block;
        }
        .image-placeholder {
            width: 100%;
            height: 80px;
            background-color: #f9f9f9;
            border: 1px dashed #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }

        /* 인쇄용 스타일 */
        @media print {
            @page {
                size: landscape;
                margin: 1cm;
            }
            body {
                background-color: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .container {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            .overflow-x-auto {
                overflow: visible !important;
            }
            table {
                width: 100% !important;
                table-layout: fixed !important; /* 너비를 강제하기 위해 fixed 레이아웃 사용 */
                page-break-inside: auto;
            }
            th, td {
                font-size: 9pt;
                padding: 5px;
                word-wrap: break-word; /* 긴 텍스트 줄바꿈 */
            }
            thead {
                display: table-header-group;
            }
            tbody tr {
                page-break-inside: avoid;
            }
            .header-section {
                page-break-after: avoid;
            }
            h1, h2 {
                page-break-after: avoid;
            }
            th {
                background-color: #f2f2f2 !important;
            }
            .main-title {
                font-size: 20pt;
            }
            .image-preview {
                max-height: 70px;
                border: 1px solid #ccc !important;
            }
            input, textarea, select {
                border: none !important;
                background-color: transparent !important;
                box-shadow: none !important;
                padding: 1px;
                font-size: 9pt;
                height: auto; 
                min-height: auto;
            }
            textarea {
                resize: none;
                overflow: hidden; /* 스크롤바 숨김 */
            }
            /* --- [수정됨] Table 1 인쇄 너비 --- */
            #risk-table-1 th:nth-child(1), #risk-table-1 td:nth-child(1) { width: 4% !important; } /* NO */
            #risk-table-1 th:nth-child(2), #risk-table-1 td:nth-child(2) { width: 28% !important; } /* 위험요인 + */
            #risk-table-1 th:nth-child(3), #risk-table-1 td:nth-child(3) { width: 8% !important; }  /* 장소 - */
            #risk-table-1 th:nth-child(4), #risk-table-1 td:nth-child(4) { width: 4% !important; }  /* 빈도 - */
            #risk-table-1 th:nth-child(5), #risk-table-1 td:nth-child(5) { width: 4% !important; }  /* 강도 - */
            #risk-table-1 th:nth-child(6), #risk-table-1 td:nth-child(6) { width: 4% !important; }  /* 등급 - */
            #risk-table-1 th:nth-child(7), #risk-table-1 td:nth-child(7) { width: 28% !important; } /* 개선대책 + */
            #risk-table-1 th:nth-child(8), #risk-table-1 td:nth-child(8) { width: 8% !important; }  /* 조치기한 */
            #risk-table-1 th:nth-child(9), #risk-table-1 td:nth-child(9) { width: 6% !important; }  /* 담당자 - */
            #risk-table-1 th:nth-child(10), #risk-table-1 td:nth-child(10) { width: 6% !important; }  /* 조치일 */
            
            /* --- [수정됨] Table 2 인쇄 너비 --- */
            #risk-table-2 th:nth-child(1), #risk-table-2 td:nth-child(1) { width: 5% !important; }  /* NO */
            #risk-table-2 th:nth-child(2), #risk-table-2 td:nth-child(2) { width: 28% !important; } /* 위험요인 + */
            #risk-table-2 th:nth-child(3), #risk-table-2 td:nth-child(3) { width: 28% !important; } /* 조치사항 + */
            #risk-table-2 th:nth-child(4), #risk-table-2 td:nth-child(4) { width: 8% !important; }  /* 조치일 - */
            #risk-table-2 th:nth-child(5), #risk-table-2 td:nth-child(5) { width: 8% !important; }  /* 조치상태 - */
            #risk-table-2 th:nth-child(6), #risk-table-2 td:nth-child(6) { width: 11.5% !important; } /* 조치 전 사진 */
            #risk-table-2 th:nth-child(7), #risk-table-2 td:nth-child(7) { width: 11.5% !important; } /* 조치 후 사진 */
        }
        
        /* [수정] 모바일 반응형 스타일 (768px 이하) */
        @media screen and (max-width: 768px) {
            body {
                background-color: white;
            }
            .container {
                max-width: 100%;
                margin: 0;
                padding: 10px;
                border: none;
                box-shadow: none;
            }

            .print-btn-container {
                padding: 0 10px;
                text-align: center;
                margin: 10px auto;
                display: flex;
                flex-wrap: wrap; /* 버튼 많을 시 줄바꿈 */
                justify-content: space-around;
                gap: 5px;
            }

            .action-button {
                padding: 10px;
                font-size: 14px;
                margin: 0;
                flex-grow: 1; /* 버튼들이 공간을 채움 */
            }

            /* 헤더 수직 정렬 */
            .header-section {
                flex-direction: column; /* 수직으로 쌓기 */
                align-items: stretch;  /* 양쪽으로 꽉 차게 */
            }

            .header-section > div:first-child {
                width: 100%;
            }
            
            #site-name {
                width: 100%;
                font-size: 16px;
            }

            /* 결재란 100% 너비 */
            .approval-table-container {
                width: 100%;
                margin-top: 20px;
                margin-left: 0;
            }

            .main-title {
                font-size: 20px;
                flex-direction: column;
                gap: 10px;
            }
            
            h2.main-title {
                font-size: 18px;
            }

            /* --- 테이블 반응형 (카드 스택) --- */
            .overflow-x-auto {
                overflow-x: visible; 
            }

            /* [수정] 모든 테이블을 반응형으로 */
            table.info-table,
            #risk-table-1, 
            #risk-table-2 {
                table-layout: auto;
            }

            table.info-table thead,
            #risk-table-1 thead, 
            #risk-table-2 thead { 
                display: none; /* 헤더 숨기기 */
            }
            
            table.info-table tbody,
            #risk-table-1 tbody, 
            #risk-table-2 tbody,
            table.info-table tr,
            #risk-table-1 tr, 
            #risk-table-2 tr { 
                display: block; 
            }

            /* [수정] 상단 정보 테이블도 카드 형식으로 */
            table.info-table tr {
                 border: none;
                 margin-bottom: 0;
            }
            
            #risk-table-1 tr, #risk-table-2 tr {
                border: 1px solid #ccc;
                margin-bottom: 15px;
                border-radius: 8px;
                overflow: hidden; /* 자식 요소가 둥근 모서리를 넘지 않도록 */
            }
            
            table.info-table td,
            #risk-table-1 td, 
            #risk-table-2 td { 
                display: block;
                border: none;
                border-bottom: 1px solid #eee; 
                position: relative;
                padding: 10px;
                text-align: left; /* 왼쪽 정렬로 변경 */
                min-height: 50px;
            }
            
            table.info-table td:last-child,
            #risk-table-1 td:last-child, 
            #risk-table-2 td:last-child {
                border-bottom: none; /* 마지막 셀 하단선 제거 */
            }

            /* [수정] 라벨을 상단에 배치 (라벨-입력란 수직 구조) */
            table.info-table td[data-label]:before,
            #risk-table-1 td[data-label]:before, 
            #risk-table-2 td[data-label]:before { 
                content: attr(data-label);
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                font-size: 13px;
                color: #555;
            }
            
            /* [수정] 상단 정보 테이블 th 대신 data-label 사용 */
            table.info-table th {
                display: none;
            }
            
            /* 첫 번째 'NO' 셀 */
            #risk-table-1 td:first-child, 
            #risk-table-2 td:first-child {
                background-color: #f2f2f2;
                font-weight: bold;
                font-size: 1.2em;
                text-align: left;
                padding-left: 10px;
            }
            #risk-table-1 td:first-child:before, 
            #risk-table-2 td:first-child:before {
                display: inline-block; /* "NO" 라벨을 숫자 옆에 표시 */
                margin-right: 5px;
                font-size: 0.8em;
            }
            
            /* 삭제 버튼 셀 */
            td.delete-cell {
                background-color: #fef2f2;
            }
            .delete-btn {
                width: 100%;
                padding: 10px;
                font-size: 14px;
            }
            
            /* [수정] 입력란 스타일 모바일 최적화 */
            td input, td textarea, td select {
                font-size: 16px; /* 모바일에서 잘 보이도록 */
                width: 100%; /* 너비 100% 보장 */
                padding: 8px;
            }
            
            /* [수정] 위험요인/개선대책 높이 확보 */
            textarea.risk-input, textarea.measure-input {
                min-height: 150px; /* 최소 높이 증가 */
            }
            
            td input[type="file"] {
                font-size: 12px;
                padding: 0;
                border: none;
            }
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="print-btn-container no-print">
        <!-- [수정] onclick 제거, id 추가 -->
        <button id="hazard-picker-btn" type="button" class="action-button bg-purple-500 hover:bg-purple-600">공종별 위험요인 선택</button>
        <button id="save-btn" class="action-button bg-blue-500 hover:bg-blue-600">내용 저장</button>
        <button id="clear-btn" class="action-button bg-red-500 hover:bg-red-600">초기화</button>
        <button id="print-btn" class="action-button">인쇄</button>
    </div>

    <!-- =============== 평가표 작성 뷰 =============== -->
    <div id="assessment-view" class="container bg-white p-6 rounded-lg border-2 border-green-500 shadow-lg">
        <div class="header-section">
            <div>
                <div class="text-sm text-gray-600 no-print">
                    * 본 문서는 가로방향으로 출력해 주세요.
                </div>
                <div class="mt-4 flex items-center">
                    <label for="site-name" class="font-bold mr-2 whitespace-nowrap text-lg">현장명:</label>
                    <input type="text" id="site-name" value="" class="w-[400px] p-2 border border-gray-300 rounded-md text-lg">
                </div>
            </div>
            <div class="approval-table-container">
                <table class="approval-table">
                    <thead>
                        <tr>
                            <th>작성자</th>
                            <th>근로자대표</th>
                            <th>관리감독자</th>
                            <th>안전관리자</th>
                            <th>현장소장</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="h-16">
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="date" value="" class="text-center approval-date"></td>
                            <td><input type="date" value="" class="text-center approval-date"></td>
                            <td><input type="date" value="" class="text-center approval-date"></td>
                            <td><input type="date" value="" class="text-center approval-date"></td>
                            <td><input type="date" value="" class="text-center approval-date"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <h1 class="main-title">
             <select>
                <option>최초</option>
                <option>상시</option>
                <option>정기</option>
                <option>수시</option>
            </select>
            위험성 평가
        </h1>

        <div class="overflow-x-auto">
            <table class="info-table mb-8">
                <tbody>
                    <tr>
                        <th class="w-32">작업명</th>
                         <!-- [신규] data-label 추가 -->
                        <td colspan="3" data-label="작업명">
                             <!-- [수정] oninput 제거 -->
                            <input type="text" id="main-work-title-input" list="work-titles-list" value="" class="p-1 border-gray-300 rounded-md">
                        </td>
                        <th class="w-32">작업기간</th>
                         <!-- [신규] data-label 추가 -->
                        <td colspan="2" data-label="작업기간">
                            <input type="text" value="" id="work-period" class="p-1 border-gray-300 rounded-md">
                        </td>
                    </tr>
                    <tr>
                        <th>작성일</th>

                    };

                    approvalDateInputs.forEach(input => {
                        dataToSave.approvalDates.push(input.value);
                    });

                    tableBody1.querySelectorAll('tr').forEach(row => {
                        const inputs = row.querySelectorAll('input, textarea');
                        dataToSave.table1Rows.push({
                            risk: inputs[0].value,       // 위험요인
                            location: inputs[1].value,   // 장소
                            freq: inputs[2].value,       // 빈도
                            strength: inputs[3].value,   // 강도
                            grade: inputs[4].value,      // 등급
                            measure: inputs[5].value,    // 개선대책
                            deadline: inputs[6].value,   // 조치기한
                            manager: inputs[7].value,    // 담당자
                            actionDate: inputs[8].value, // 조치일
                        });
                    });

                    tableBody2.querySelectorAll('tr').forEach(row => {
                        const inputs = row.querySelectorAll('input, textarea');
                        const imgBefore = row.querySelector('.image-preview[id^="preview-before-"]').src;
                        const imgAfter = row.querySelector('.image-preview[id^="preview-after-"]').src;
                        
                        dataToSave.table2Rows.push({
                            risk: inputs[0].value,       // 위험요인
                            measure: inputs[1].value,    // 조치사항
                            actionDate: inputs[2].value, // 조치일
                            status: inputs[3].value,     // 조치상태
                            imgBefore: imgBefore.startsWith('data:image') ? imgBefore : '',
                            imgAfter: imgAfter.startsWith('data:image') ? imgAfter : ''
                        });
                    });

                    localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
                    alert('내용이 브라우저에 저장되었습니다.');

                } catch (error) {
                    console.error("데이터 저장 중 오류 발생:", error);
                    alert('데이터 저장 중 오류가 발생했습니다. 개발자 콘솔을 확인해주세요.');
                }
            };

            /**
             * 데이터 불러오기 함수
             */
            const loadData = () => {
                const savedData = localStorage.getItem(SAVE_KEY);
                if (!savedData) {
                    addRow();
                    return;
                }
                try {
                    const data = JSON.parse(savedData);
                    siteNameInput.value = data.siteName || '';
                    mainWorkTitleInput.value = data.mainWorkTitle || '';
                    workPeriodInput.value = data.workPeriod || '';
                    creationDateInput.value = data.creationDate || '';
                    departmentInput.value = data.department || '';

                    if (data.approvalDates) {
                        data.approvalDates.forEach((date, index) => {
                            if (approvalDateInputs[index]) {
                                approvalDateInputs[index].value = date;
                            }
                        });
                    }

                    tableBody1.innerHTML = '';
                    tableBody2.innerHTML = '';

                    if (data.table1Rows && data.table2Rows && data.table1Rows.length === data.table2Rows.length && data.table1Rows.length > 0) {
                        for (let i = 0; i < data.table1Rows.length; i++) {
                            loadRow(i + 1, data.table1Rows[i], data.table2Rows[i]);
                        }
                    } else {
                        addRow();
                    }
                } catch (error) {
                    console.error("데이터 불러오기 중 오류 발생:", error);
                    alert('저장된 데이터를 불러오는 중 오류가 발생했습니다.');
                    localStorage.removeItem(SAVE_KEY);
                    addRow();
                }
            };

            /**
             * 데이터 초기화 함수
             */
            const clearData = () => {
                if (window.confirm("정말로 모든 내용을 초기화하시겠습니까?\n저장된 데이터가 영구히 삭제됩니다.")) {
                    localStorage.removeItem(SAVE_KEY);
                    tableBody1.innerHTML = '';
                    tableBody2.innerHTML = '';
                    siteNameInput.value = '';
                    mainWorkTitleInput.value = '';
                    workPeriodInput.value = '';
                    creationDateInput.value = '';
                    departmentInput.value = '';
                    approvalDateInputs.forEach(input => input.value = '');
                    addRow(); // 초기화 후 빈 행 1개 추가
                }
            };

            // --- 초기화 및 이벤트 리스너 실행 ---

            // 1. Datalist와 Map 채우기
            if (workTitlesDatalist) {
                workTitlesDatalist.innerHTML = '';
                workData.forEach(item => {
                    workDataMap[item.workName] = item.risks;
                    const option = document.createElement('option');
                    option.value = item.workName;
                    workTitlesDatalist.appendChild(option);
                });
            } else {
                console.error("'work-titles-list' Datalist를 찾을 수 없습니다.");
            }
            
            // 2. [수정] 정적 버튼들에 이벤트 리스너 추가
            document.getElementById('add-row-btn').addEventListener('click', () => addRow());
            document.getElementById('save-btn').addEventListener('click', saveData);
            document.getElementById('clear-btn').addEventListener('click', clearData);
            document.getElementById('print-btn').addEventListener('click', () => window.print());

            // --------------------------------------------------
            // [신규] 대분류(토목/건축) → 공종 → 유해위험요인 선택 모달
            // --------------------------------------------------
            const hazardModal = document.getElementById('hazard-picker-modal');
            const hazardMajorTabs = document.getElementById('hazard-major-tabs');
            const hazardCategoryPanel = document.getElementById('hazard-category-panel');
            const hazardItemPanel = document.getElementById('hazard-item-panel');
            const hazardSelectedCountEl = document.getElementById('hazard-selected-count');

            let activeHazardMajorIndex = 0;
            let activeHazardCategoryIndex = 0;
            // key: "대분류인덱스-공종인덱스-항목인덱스" -> { risk, measure }
            const selectedHazards = new Map();

            const updateHazardSelectedCount = () => {
                hazardSelectedCountEl.textContent = `${selectedHazards.size}개 선택됨`;
            };

            const renderHazardMajorTabs = () => {
                hazardMajorTabs.innerHTML = '';
                hazardCatalog.forEach((majorGroup, majorIndex) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'hazard-major-tab-btn' + (majorIndex === activeHazardMajorIndex ? ' active' : '');
                    btn.textContent = majorGroup.major;
                    btn.addEventListener('click', () => {
                        activeHazardMajorIndex = majorIndex;
                        activeHazardCategoryIndex = 0;
                        renderHazardMajorTabs();
                        renderHazardCategoryPanel();
                        renderHazardItemPanel();
                    });
                    hazardMajorTabs.appendChild(btn);
                });
            };

            const renderHazardCategoryPanel = () => {
                hazardCategoryPanel.innerHTML = '';
                const subCategories = hazardCatalog[activeHazardMajorIndex].subCategories;
                subCategories.forEach((cat, catIndex) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'hazard-category-btn' + (catIndex === activeHazardCategoryIndex ? ' active' : '');
                    btn.textContent = `${cat.category} (${cat.items.length})`;
                    btn.addEventListener('click', () => {
                        activeHazardCategoryIndex = catIndex;
                        renderHazardCategoryPanel();
                        renderHazardItemPanel();
                    });
                    hazardCategoryPanel.appendChild(btn);
                });
            };

            const renderHazardItemPanel = () => {
                hazardItemPanel.innerHTML = '';
                const cat = hazardCatalog[activeHazardMajorIndex].subCategories[activeHazardCategoryIndex];
                if (!cat) return;

                cat.items.forEach((item, itemIndex) => {
                    const key = `${activeHazardMajorIndex}-${activeHazardCategoryIndex}-${itemIndex}`;
                    const card = document.createElement('label');
                    card.className = 'hazard-item-card';
                    card.innerHTML = `
                        <input type="checkbox" class="hazard-item-checkbox" data-key="${key}" ${selectedHazards.has(key) ? 'checked' : ''}>
                        <div>
                            <p class="hazard-item-risk">${item.risk}</p>
                            <p class="hazard-item-measure">↳ 감소대책(자동입력): ${item.measure}</p>
                        </div>
                    `;
                    const checkbox = card.querySelector('.hazard-item-checkbox');
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            selectedHazards.set(key, { risk: item.risk, measure: item.measure });
                        } else {
                            selectedHazards.delete(key);
                        }
                        updateHazardSelectedCount();
                    });
                    hazardItemPanel.appendChild(card);
                });
            };

            const openHazardModal = () => {
                activeHazardMajorIndex = 0;
                activeHazardCategoryIndex = 0;
                renderHazardMajorTabs();
                renderHazardCategoryPanel();
                renderHazardItemPanel();
                updateHazardSelectedCount();
                hazardModal.classList.add('open');
            };

            const closeHazardModal = () => {
                hazardModal.classList.remove('open');
            };

            document.getElementById('hazard-picker-btn').addEventListener('click', openHazardModal);
            document.getElementById('hazard-modal-close-x').addEventListener('click', closeHazardModal);
            document.getElementById('hazard-modal-cancel').addEventListener('click', closeHazardModal);

            // 오버레이(바깥) 클릭 시 닫기
            hazardModal.addEventListener('click', (event) => {
                if (event.target === hazardModal) closeHazardModal();
            });

            // ESC 키로 닫기
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && hazardModal.classList.contains('open')) {
                    closeHazardModal();
                }
            });

            document.getElementById('hazard-modal-add').addEventListener('click', () => {
                if (selectedHazards.size === 0) {
                    alert('선택된 유해위험요인이 없습니다.');
                    return;
                }

                // 빈 기본행(1행, 미입력)이면 선택 항목으로 대체
                const isTableEmpty = tableBody1.rows.length === 1 &&
                                    tableBody1.rows[0].querySelector('textarea.risk-input').value === '' &&
                                    tableBody1.rows[0].querySelector('textarea.measure-input').value === '';
                if (isTableEmpty) {
                    tableBody1.innerHTML = '';
                    tableBody2.innerHTML = '';
                }

                selectedHazards.forEach(({ risk, measure }) => {
                    addRow(risk, measure);
                });

                selectedHazards.clear();
                closeHazardModal();
            });
            
            // '작업명' 입력란에 이벤트 리스너 추가
            mainWorkTitleInput.addEventListener('input', (e) => populateAllRisksAndMeasures(e.target.value));

            // 3. [수정] 동적 버튼/입력란에 '이벤트 위임'으로 리스너 추가
            const container = document.getElementById('assessment-view');
            container.addEventListener('click', (event) => {
                // '삭제' 버튼 클릭 시
                if (event.target && event.target.classList.contains('delete-btn')) {
                    deleteRow(event.target);
                }
            });
            
            container.addEventListener('change', (event) => {
                 // '이미지' 파일 선택 시
                if (event.target && event.target.classList.contains('image-input')) {
                    previewImage(event);
                }
            });

            // 4. 페이지 로드 시 저장된 데이터 불러오기
            loadData();
        });
    </script>
</body>
</html>
